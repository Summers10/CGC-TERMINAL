name: Update CGC data

on:
  schedule:
    - cron: "30 22 * * 4"
    - cron: "30 14 * * 5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install curl_cffi openpyxl
      - name: Fetch CGC Grain Statistics Weekly
        run: python scripts/fetch_cgc.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cgc.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "CGC GSW update $(date -u +%Y-%m-%d)"
            git push
          fi
