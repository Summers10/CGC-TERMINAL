function fmtPctNormal(v){ return (v===null||v===undefined||isNaN(v)) ? '—' : Math.round(v)+'%'; }
function fmtTempDep(v){
  if(v===null||v===undefined||isNaN(v)) return '—';
  const s = v>=0?'+':'';
  return s+v.toFixed(1)+'°C';
}
// band (optional): values within +/-band of normal are left uncoloured ("normal").
// Without a band, anything above/below normal is coloured (used for the temp departures).
function weatherDirClass(v, isPct, band){
  if(v===null||v===undefined||isNaN(v)) return '';
  const baseline = isPct ? 100 : 0;
  const dev = v - baseline;
  if(band !== undefined && Math.abs(dev) <= band) return '';
  if(dev>0) return 'cftc-up';
  if(dev<0) return 'cftc-dn';
  return '';
}

function escHtml(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function fmtPctNormalWithMm(v, mm){
  const pct = fmtPctNormal(v);
  if(mm===null||mm===undefined||isNaN(mm)) return pct;
  return `${pct} <span style="color:var(--text3);font-size:10px">(${Math.round(mm)}mm)</span>`;
}
function fmtHiLo(hi, lo){
  if((hi===null||hi===undefined||isNaN(hi)) && (lo===null||lo===undefined||isNaN(lo))) return '—';
  const hiTxt = (hi===null||hi===undefined||isNaN(hi)) ? '—' : Math.round(hi)+'°';
  const loTxt = (lo===null||lo===undefined||isNaN(lo)) ? '—' : Math.round(lo)+'°';
  return `${hiTxt} / ${loTxt}`;
}

// Footnote under the weather table: which models were used, and when the weather run was pulled.
// "As of" is when the fetcher pulled the data (shown in the viewer's local time); Open-Meteo blends several
// models that each run on their own schedule, so there is no single model-initialisation time to quote.
function buildWeatherFootnote(){
  if(!WEATHER_DATA) return weatherState === 'loading' ? '' : 'Weather data unavailable.';
  const meta = WEATHER_DATA._meta || {};
  const regions = WEATHER_DATA.regions || {};
  const hasOutlook = Object.values(regions).some(r => 'outlook_temp_dep_c' in r);
  let when = '';
  if(meta.fetched_at){
    const dt = new Date(meta.fetched_at);
    when = isNaN(dt) ? String(meta.fetched_at)
      : dt.toLocaleString('en-US', {month:'short', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit', timeZoneName:'short'});
  }
  let txt = 'Weather models: Open-Meteo best-match blend of national weather models (incl. NOAA GFS/HRRR, ECMWF IFS, DWD ICON, GEM) for recent conditions and the 14-day forecast; normals from 10 years of ERA5 reanalysis';
  if(hasOutlook) txt += '; outlook from the ECMWF SEAS5 seasonal ensemble (a lean, not a forecast)';
  txt += '.';
  if(when) txt += ' As of ' + escHtml(when) + ' weather run.';
  if(meta.outlook_error) txt += ' Outlook incomplete: ' + escHtml(meta.outlook_error) + '.';
  return txt;
}

function buildWeatherTable(){
  const regions = (WEATHER_DATA && WEATHER_DATA.regions) || {};
  const wxMeta = (WEATHER_DATA && WEATHER_DATA._meta) || {};
  // The Outlook group appears whenever the data file carries outlook fields (they're null if the seasonal call failed).
  const hasOutlook = Object.values(regions).some(r => 'outlook_temp_dep_c' in r);

  // One rule for every precip column: left uncoloured ("normal") within +/-20% of normal, coloured outside it.
  const PRECIP_BAND = 20;
  const groups = [
    {label:'Historical', cols:[
      {l:'90D Precip', w:10.5},
      {l:'30D Precip', w:10.5},
      {l:'7D Temp Dep', w:9.5},
    ]},
    {label:'Forecast (Next 14 Days)', cols:[
      {l:'Temp Dep', w:9.5},
      {l:'Hi / Lo (°C)', w:10.5},
      {l:'Precip', w:10.5},
    ]},
  ];
  if(hasOutlook){
    groups.push({label:'Outlook ' + (wxMeta.outlook_label || '3 Mo'), cols:[
      {l:'Temp Dep', w:8},
      {l:'Precip', w:8},
    ]});
  }
  const totalCols = 1 + groups.reduce((sum,g)=>sum+g.cols.length,0);
  const pcts = colPercents([23, ...groups.flatMap(g=>g.cols.map(c=>c.w))]);
  let html = `<table class="weather-table"><colgroup>${pcts.map(pc=>`<col style="width:${pc}">`).join('')}`;
  html += `</colgroup><thead><tr><th rowspan="2" style="text-align:left">Region</th>`;
  groups.forEach(g=>{ html += `<th colspan="${g.cols.length}" class="grp-l" style="text-align:center;color:var(--amber);font-size:12px;letter-spacing:.08em">${g.label}</th>`; });
  html += `</tr><tr>`;
  groups.forEach(g=>{
    g.cols.forEach((c,i)=>{ html += `<th${i===0?' class="grp-l"':''}>${c.l}</th>`; });
  });
  html += `</tr></thead><tbody>`;

  // Rows are grouped under a division header (Canada / United States / South America / Europe / Asia).
  // The division comes from the data file itself (fetch_weather.py is the single place regions are defined).
  let curDiv = null;
  Object.keys(regions).forEach(name=>{
    const d = regions[name];
    if(d.division && d.division !== curDiv){
      curDiv = d.division;
      html += `<tr class="cftc-row-section"><td colspan="${totalCols}">${curDiv}</td></tr>`;
    }
    html += `<tr><td>${name}</td>`;
    html += `<td class="grp-l ${weatherDirClass(d.precip_90d_pct_normal, true, PRECIP_BAND)}">${fmtPctNormalWithMm(d.precip_90d_pct_normal, d.precip_90d_mm)}</td>`;
    html += `<td class="${weatherDirClass(d.precip_30d_pct_normal, true, PRECIP_BAND)}">${fmtPctNormalWithMm(d.precip_30d_pct_normal, d.precip_30d_mm)}</td>`;
    html += `<td class="${weatherDirClass(d.temp_dep_7d_c, false)}">${fmtTempDep(d.temp_dep_7d_c)}</td>`;
    html += `<td class="grp-l ${weatherDirClass(d.temp_dep_14d_forecast_c, false)}">${fmtTempDep(d.temp_dep_14d_forecast_c)}</td>`;
    html += `<td>${fmtHiLo(d.temp_14d_forecast_hi_c, d.temp_14d_forecast_lo_c)}</td>`;
    html += `<td class="${weatherDirClass(d.precip_14d_forecast_pct_normal, true, PRECIP_BAND)}">${fmtPctNormalWithMm(d.precip_14d_forecast_pct_normal, d.precip_14d_forecast_mm)}</td>`;
    if(hasOutlook){
      html += `<td class="grp-l ${weatherDirClass(d.outlook_temp_dep_c, false, 0.3)}">${fmtTempDep(d.outlook_temp_dep_c)}</td>`;
      html += `<td class="${weatherDirClass(d.outlook_precip_pct_normal, true, PRECIP_BAND)}">${fmtPctNormal(d.outlook_precip_pct_normal)}</td>`;
    }
    html += `</tr>`;
  });
  html += `</tbody></table>`;
  return html;
}

function buildCropCalendarTable(){
  const curMonth = new Date().getMonth() + 1; // 1-12

  const calPcts = colPercents([20, ...CAL_MONTHS.map(()=>80/CAL_MONTHS.length)]);
  let html = `<table class="cal-table"><colgroup>${calPcts.map(pc=>`<col style="width:${pc}">`).join('')}`;
  html += `</colgroup><thead><tr><th style="text-align:left">Origin</th>`;
  CAL_MONTHS.forEach((m,i)=>{
    const isCur = (i+1)===curMonth;
    html += `<th class="${isCur?'cal-cur-month':''}">${m}</th>`;
  });
  html += `</tr></thead><tbody>`;

  let curSection = null;
  CROP_CALENDAR.forEach(row=>{
    if(row.section !== curSection){
      curSection = row.section;
      html += `<tr class="cftc-row-section"><td colspan="13">${curSection}</td></tr>`;
    }
    html += `<tr><td>${row.origin}</td>`;
    for(let m=1; m<=12; m++){
      const isPlant = row.plant.includes(m);
      const isHarvest = row.harvest.includes(m);
      const isCur = m===curMonth;
      let bg = 'transparent', label = '';
      if(isPlant && isHarvest){ bg = 'linear-gradient(135deg, rgba(46,143,82,.35) 50%, rgba(230,180,20,.4) 50%)'; label = 'P/H'; }
      else if(isPlant){ bg = 'rgba(46,143,82,.30)'; label = 'P'; }
      else if(isHarvest){ bg = 'rgba(230,180,20,.40)'; label = 'H'; }
      const curCls = isCur ? ' cal-cur-month' : '';
      html += `<td class="${curCls}" style="background:${bg};color:var(--text);font-weight:700">${label}</td>`;
    }
    html += `</tr>`;
  });
  html += `</tbody></table>`;
  return html;
}

function renderSummary(){
  const root = document.getElementById('summary-root');
  root.innerHTML = '';
  // Not every run refreshes every source (a failed fetcher keeps its previous data) - so show the NEWEST run time
  // here. How fresh each source's data really is is what the "Data as of" line below is for.
  const stamps = [DATA, CFTC_DATA, EXPORTS_DATA]
    .map(d => d && d._meta && d._meta.fetched_at)
    .filter(Boolean)
    .sort()
    .reverse();
  const asOf = [];
  { const d = latestCftcDate(); if(d) asOf.push('CFTC ' + fmtAsOfDate(d, true)); }
  { const d = parseAnyDate(DATA && DATA._meta && DATA._meta.wasde_release); if(d) asOf.push('USDA ' + fmtAsOfDate(d, false) + ' WASDE'); }
  { const d = latestExportsDate(); if(d) asOf.push('Exports wk ending ' + fmtAsOfDate(d, true)); }
  setMetaLines('summary-meta', stamps.length ? stamps[0] : 'unknown', asOf.length ? 'Data as of: ' + asOf.join(' · ') : '');
  root.insertAdjacentHTML('beforeend', buildSummaryTable());

  root.insertAdjacentHTML('beforeend', `<div class="page-footnote"><ul>
    <li>Domestic = United States, except Canola (Canada) and Coffee/Sugar (Brazil), the actual major producers. Those rows have no Export Sales YoY.</li>
    <li>Soyoil (Vegoils) and Soymeal (Meal): Seasonality, Positioning and Export Sales use Soybean Oil / Soybean Meal. Production YoY and Stocks/Use Rank combine all oils / all meals.</li>
    <li>Cocoa: Positioning and Seasonality only. USDA doesn't track cocoa.</li>
    <li>Seasonality: this week and next. Positioning Change = the week's move in net position (contracts); same direction as the net position = adding, opposite = unwinding.</li>
    <li>Coffee and Sugar use USDA's semi-annual reports, not the monthly WASDE shown in the header.</li>
  </ul></div>`);
}

// The Weather page: the weather table + the crop calendar (static reference). Independent of the Summary page.
function renderWeatherPage(){
  const root = document.getElementById('weather-root');
  if(!root) return;
  root.innerHTML = '';
  const stamp = WEATHER_DATA && WEATHER_DATA._meta && WEATHER_DATA._meta.fetched_at;
  setMetaLines('weather-meta', weatherState === 'loading' ? 'loading…' : (stamp || 'unavailable'), '');
  root.insertAdjacentHTML('beforeend', `<div class="cftc-row-section" style="padding:8px 10px;border-top:2px solid var(--amber);color:var(--amber);font-weight:900;text-transform:uppercase;letter-spacing:.16em;font-size:13px;margin:0">Weather — Major Growing Regions</div>`);
  if(WEATHER_DATA){
    root.insertAdjacentHTML('beforeend', `<div class="tbl-wrap">${buildWeatherTable()}</div>`);
  } else {
    root.insertAdjacentHTML('beforeend', `<div style="padding:18px 0;color:var(--text3)">${weatherState==='loading' ? 'Loading weather…' : ''}</div>`);
  }

  root.insertAdjacentHTML('beforeend', `<div class="cftc-row-section" style="padding:8px 10px;border-top:2px solid var(--amber);color:var(--amber);font-weight:900;text-transform:uppercase;letter-spacing:.16em;font-size:13px;margin:28px 0 0">Crop Calendar — Major Origins</div>`);
  root.insertAdjacentHTML('beforeend', `<div style="font-size:11px;color:var(--text3);margin:10px 0"><span style="background:rgba(46,143,82,.30);padding:1px 6px;border-radius:2px">P</span> Planting &nbsp; <span style="background:rgba(230,180,20,.40);padding:1px 6px;border-radius:2px">H</span> Harvest — standard reference windows, not live data; actual dates shift with weather and region within each country.</div>`);
  root.insertAdjacentHTML('beforeend', `<div class="tbl-wrap">${buildCropCalendarTable()}</div>`);
}
renderWeatherPage();   // the crop calendar is static, so draw the page right away; the weather table fills in when its data arrives

function seasonalColor(v){
  if(v===null||v===undefined) return '#fff';
  const t = Math.min(Math.abs(v),5)/5;
  if(v>=0){
    const r = Math.round(255+(46-255)*t), g = Math.round(255+(143-255)*t), b = Math.round(255+(82-255)*t);
    return `rgb(${r},${g},${b})`;
  } else {
    const r = Math.round(255+(184-255)*t), g = Math.round(255+(56-255)*t), b = Math.round(255+(56-255)*t);
    return `rgb(${r},${g},${b})`;
  }
}

let seasonalsMonth = null;

// Calendar order. The list's first slot ("Dec 29") is the week straddling New Year, so it is shown with January.
const SEAS_MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function getSeasonalsMonths(){ return SEAS_MONTHS; }
function seasWeekMonth(i){ return i===0 ? 'Jan' : SEASONALS_WEEKS[i].split(' ')[0]; }
// Selected month + the next 2, wrapping at year end (Dec -> Jan, Feb). When a window runs Dec -> Jan the New Year
// week is already covered by the final "Dec 28" slot, so the leading "Dec 29" slot is left out to avoid a duplicate.
function seasWindow(startMonth){
  const s = SEAS_MONTHS.indexOf(startMonth);
  const window = [0,1,2].map(k=>SEAS_MONTHS[(s+k)%12]);
  const wraps = window.indexOf('Dec')>=0 && window.indexOf('Jan')>=0 && window.indexOf('Dec') < window.indexOf('Jan');
  const cols = [];
  window.forEach(m=>{ SEASONALS_WEEKS.forEach((w,i)=>{ if(seasWeekMonth(i)===m && !(wraps && i===0)) cols.push({w,i}); }); });
  return {window, cols};
}

function defaultSeasonalsMonth(){
  const months = getSeasonalsMonths();
  const nowAbbr = new Date().toLocaleString('en-US',{month:'short'});
  return months.includes(nowAbbr) ? nowAbbr : months[0];
}

function buildSeasonalsTable(startMonth){
  const cols = seasWindow(startMonth).cols;   // rolling quarter: selected month + next 2 (wraps at year end)

  let html = `<table class="seas-table"><thead><tr><th class="seas-label-h">Product</th>`;
  cols.forEach(o=>{ html += `<th>${o.w}</th>`; });
  html += `</tr></thead><tbody>`;

  SEASONALS_SECTIONS.forEach(section=>{
    html += `<tr class="seas-section-row"><td colspan="${cols.length+1}">${section.label}</td></tr>`;
    section.products.forEach(p=>{
      const vals = SEASONALS_DATA[p] || [];
      html += `<tr><td class="seas-label">${p}</td>`;
      cols.forEach(o=>{
        const v = vals[o.i];
        const text = (v===null||v===undefined) ? '—' : (v>0?'+':'')+v;
        html += `<td style="background:${seasonalColor(v)}">${text}</td>`;
      });
      html += `</tr>`;
    });
  });
  html += `</tbody></table>`;
  return html;
}

function renderSeasonals(){
  if(!seasonalsMonth) seasonalsMonth = defaultSeasonalsMonth();

    selHtml += `<button class="tbtn seas-month-btn${m===seasonalsMonth?' active':''}" data-m="${m}">${m}</button>`;
  });

  root.innerHTML = selHtml + buildSeasonalsTable(seasonalsMonth) + `<div class="page-footnote">Forward-looking weekly seasonal score (-5 to +5), 15-year lookback. Static — manually entered, not auto-updating.</div>`;

    b.addEventListener('click', ()=>{ seasonalsMonth = b.dataset.m; renderSeasonals(); });

}

<script>
let EXPORTS_DATA = null;
let exportsCommodity = null;
let exportsView = 'wow';     // 'country' | 'wow' - opens on Week over Week
let EXPORTS_HISTORY = null;      // weekly snapshots kept by fetch_exports.py (needed for week-over-week)

function expFmt(v){ return (v===null||v===undefined||isNaN(v)) ? '—' : Math.round(v).toLocaleString(); }
function expSignedPct(v){
  if(v===null||v===undefined||isNaN(v)) return '—';
  const s = v>=0?'+':'';
  return s+v.toFixed(1)+'%';
}

function buildExportsSummaryTable(){
  const cols = [
    {label:'Net Sales (Wk)'},
    {label:'Outstanding Sales'},
    {label:'Accum. Exports (YTD)'},
    {label:'Total Commitment'},
    {label:'Accum. Exports YoY'},
    {label:'Total Commitment YoY'},
  ];
  let html = `<table class="exp-table"><thead><tr><th>Commodity</th>`;
  cols.forEach(c=>{ html += `<th>${c.label}</th>`; });
  html += `</tr></thead><tbody>`;

  const commodities = EXPORTS_DATA.commodities || {};
  Object.keys(commodities).forEach(commName=>{
    const t = commodities[commName].total;
    if(!t) return;
    html += `<tr class="exp-click${commName===exportsCommodity?' exp-sel':''}" data-c="${commName.replace(/"/g,'&quot;')}" title="Click for the country detail below"><td>${commName}</td>`;
    html += `<td class="${t.net_sales>=0?'cftc-up':'cftc-dn'}">${expFmt(t.net_sales)}</td>`;
    html += `<td>${expFmt(t.outstanding_sales)}</td>`;
    html += `<td>${expFmt(t.accumulated_exports)}</td>`;
    html += `<td>${expFmt(t.total_commitment)}</td>`;
    html += `<td class="${t.yoy_accum_exports_pct>=0?'cftc-up':'cftc-dn'}">${expSignedPct(t.yoy_accum_exports_pct)}</td>`;
    html += `<td class="${t.yoy_total_commitment_pct>=0?'cftc-up':'cftc-dn'}">${expSignedPct(t.yoy_total_commitment_pct)}</td>`;
    html += `</tr>`;
  });
  html += `</tbody></table>`;
  return html;
}

// Week over Week: one row per weekly report for the selected commodity, same columns as the summary table above,
// so you can see how exports have developed through the marketing year. Rows come from the history kept by
// fetch_exports.py (rebuilt from earlier saved runs, then one new week at a time).
function expIso(period){ const d = parseAnyDate(period); return d ? d.toISOString().slice(0,10) : null; }

function buildExportsWowTable(commName){
  const comm = (EXPORTS_DATA.commodities || {})[commName];
  if(!comm || !comm.total) return '<div style="color:var(--text3);padding:10px 0">No data</div>';

  // saved weeks + the week currently in export_sales.json (the freshest pull wins for its own week)
  const rows = {};
  if(EXPORTS_HISTORY && EXPORTS_HISTORY.weeks){
    Object.keys(EXPORTS_HISTORY.weeks).forEach(iso=>{ const r = EXPORTS_HISTORY.weeks[iso][commName]; if(r) rows[iso] = r.total ? Object.assign({mkt_year:r.mkt_year}, r.total) : r; });   // .total = earlier file shape
  }
  const t = comm.total, curIso = expIso(t.period_ending);
  if(curIso) rows[curIso] = {mkt_year:t.mkt_year, net_sales:t.net_sales, outstanding_sales:t.outstanding_sales, accumulated_exports:t.accumulated_exports,
    total_commitment:t.total_commitment, yoy_accum_exports_pct:t.yoy_accum_exports_pct, yoy_total_commitment_pct:t.yoy_total_commitment_pct};
  const isos = Object.keys(rows).sort().reverse();      // newest first

  const n = isos.length;
  let cap = `${n} weekly report${n===1?'':'s'} on file for this commodity`;
  if(n < 4) cap += ' — more weeks appear as each weekly report is collected';

  const cols = ['Net Sales (Wk)','Outstanding Sales','Accum. Exports (YTD)','Total Commitment','Accum. Exports YoY','Total Commitment YoY'];
  let html = `<div class="exp-cap">${cap}</div><table class="exp-table"><thead><tr><th>Week Ending</th>`;
  cols.forEach(c=>{ html += `<th>${c}</th>`; });
  html += `</tr></thead><tbody>`;

  let lastMy = null;
  isos.forEach((iso, k)=>{
    const r = rows[iso];
    if(r.mkt_year && r.mkt_year !== lastMy){            // marketing-year divider (weeks are comparable within one)
      html += `<tr class="exp-row-section"><td colspan="7">Marketing year ${r.mkt_year}</td></tr>`;
      lastMy = r.mkt_year;
    }
    html += `<tr class="${k===0?'exp-latest':''}"><td>${fmtAsOfDate(parseAnyDate(iso), true)}</td>`;
    html += `<td class="${r.net_sales>=0?'cftc-up':'cftc-dn'}">${expFmt(r.net_sales)}</td>`;
    html += `<td>${expFmt(r.outstanding_sales)}</td>`;
    html += `<td>${expFmt(r.accumulated_exports)}</td>`;
    html += `<td>${expFmt(r.total_commitment)}</td>`;
    html += `<td class="${r.yoy_accum_exports_pct>=0?'cftc-up':'cftc-dn'}">${expSignedPct(r.yoy_accum_exports_pct)}</td>`;
    html += `<td class="${r.yoy_total_commitment_pct>=0?'cftc-up':'cftc-dn'}">${expSignedPct(r.yoy_total_commitment_pct)}</td>`;
    html += `</tr>`;
  });
  html += `</tbody></table>`;
  return html;
}

function buildExportsCountryTable(commName){
  const cols = [
    {label:'Net Sales (Wk)'},
    {label:'Outstanding Sales'},
    {label:'Accum. Exports (YTD)'},
    {label:'Total Commitment'},
    {label:'Accum. Exports YoY'},
    {label:'Total Commitment YoY'},
  ];
  let html = `<table class="exp-table"><thead><tr><th>Country</th>`;
  cols.forEach(c=>{ html += `<th>${c.label}</th>`; });
  html += `</tr></thead><tbody>`;

  const comm = (EXPORTS_DATA.commodities || {})[commName];
  const countries = comm ? (comm.countries || {}) : {};
  const countryNames = Object.keys(countries)
    .sort((a,b) => (countries[b].accumulated_exports||0) - (countries[a].accumulated_exports||0));

  if(!countryNames.length){
    html += `<tr><td colspan="${cols.length+1}" style="color:var(--text3)">No country data</td></tr>`;
  } else {
    countryNames.forEach(cName=>{
      const d = countries[cName];
      html += `<tr><td>${cName}</td>`;
      html += `<td class="${d.net_sales>=0?'cftc-up':'cftc-dn'}">${expFmt(d.net_sales)}</td>`;
      html += `<td>${expFmt(d.outstanding_sales)}</td>`;
      html += `<td>${expFmt(d.accumulated_exports)}</td>`;
      html += `<td>${expFmt(d.total_commitment)}</td>`;
      html += `<td class="${d.yoy_accum_exports_pct>=0?'cftc-up':'cftc-dn'}">${expSignedPct(d.yoy_accum_exports_pct)}</td>`;
      html += `<td class="${d.yoy_total_commitment_pct>=0?'cftc-up':'cftc-dn'}">${expSignedPct(d.yoy_total_commitment_pct)}</td>`;
      html += `</tr>`;
    });
  }
  html += `</tbody></table>`;
  return html;
}

function renderExports(){
  const root = document.getElementById('exports-root');
  root.innerHTML = '';
  { const d = latestExportsDate(); setMetaLines('exports-meta', EXPORTS_DATA._meta?.fetched_at, d ? 'Week ending ' + fmtAsOfDate(d, true) : ''); }

  const commodities = Object.keys(EXPORTS_DATA.commodities || {});
  if(!exportsCommodity || !commodities.includes(exportsCommodity)){
    exportsCommodity = commodities[0];
  }

  root.insertAdjacentHTML('beforeend', `<div class="cftc-row-section" style="padding:8px 10px;border-top:2px solid var(--amber);color:var(--amber);font-weight:900;text-transform:uppercase;letter-spacing:.16em;font-size:13px;margin-bottom:0">Commodity Summary — YTD vs Prior Year<span class="exp-hint">click a commodity to see its detail below</span></div>`);
  root.insertAdjacentHTML('beforeend', buildExportsSummaryTable());
  root.insertAdjacentHTML('beforeend', `<div id="exports-detail"></div>`);
  root.insertAdjacentHTML('beforeend', `<div class="page-footnote">Metric tons (cotton: running bales); current marketing year only. Net Sales = new sales this week, net of cancellations · Outstanding = sold, not yet shipped · Accum. Exports = shipped YTD · Total Commitment = Accum. + Outstanding. Week over Week lists each weekly report, newest first.</div>`);

  // click a commodity in the summary to switch the detail below (no re-render of the page, so nothing jumps)
  root.querySelectorAll('.exp-table tr.exp-click').forEach(tr=>{
    tr.addEventListener('click', ()=>{ exportsCommodity = tr.dataset.c; renderExportsDetail(); });
  });
  renderExportsDetail();
}

// The lower section: country breakdown or week-over-week for the commodity selected in the summary table.
function renderExportsDetail(){
  const box = document.getElementById('exports-detail');
  if(!box || !EXPORTS_DATA) return;
  document.querySelectorAll('#exports-root tr.exp-click').forEach(tr=>tr.classList.toggle('exp-sel', tr.dataset.c === exportsCommodity));
  const title = exportsView === 'wow'
    ? `Week over Week — ${exportsCommodity}`
    : `By Country — ${exportsCommodity} — Largest to Smallest`;
  let html = `<div class="cftc-row-section" style="padding:8px 10px;border-top:2px solid var(--amber);color:var(--amber);font-weight:900;text-transform:uppercase;letter-spacing:.16em;font-size:13px;margin:24px 0 0">${title}</div>`;
  html += `<div class="toggle" style="display:inline-flex;margin:14px 0"><button class="tbtn exp-view-btn${exportsView==='country'?' active':''}" data-v="country">Country Breakdown</button><button class="tbtn exp-view-btn${exportsView==='wow'?' active':''}" data-v="wow">Week over Week</button></div>`;
  html += exportsView === 'wow' ? buildExportsWowTable(exportsCommodity) : buildExportsCountryTable(exportsCommodity);
  box.innerHTML = html;
  box.querySelectorAll('.exp-view-btn').forEach(b=>b.addEventListener('click', ()=>{ exportsView = b.dataset.v; renderExportsDetail(); }));
}

// Week-over-week history is optional: without it the toggle still works and says the prior week isn't on file yet.
fetch('data/export_sales_history.json?_=' + Date.now())
  .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
  .then(h=>{ EXPORTS_HISTORY = h; renderExportsDetail(); })
  .catch(()=>{ /* not created yet - fine */ });

fetch('data/export_sales.json?_=' + Date.now())
  .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
  .then(data=>{
    EXPORTS_DATA = data;
    renderExports();
    exportsReady = true;
    checkSummaryReady();
  })
  .catch(e=>{
    document.getElementById('exports-root').innerHTML = `<div id="exports-err">Error loading export sales data: ${e.message}</div>`;
    exportsReady = true; // don't block the Summary tab forever if this one source fails
    checkSummaryReady();
  });
</script>

<style>
.oil-table{width:100%;border-collapse:collapse;border:1px solid var(--border2);background:var(--bg)}
.oil-table th{background:var(--th-bg);padding:8px 8px;text-align:right;font-size:14px;font-weight:800;letter-spacing:.05em;color:var(--text2);border-bottom:2px solid var(--border2);white-space:nowrap}
.oil-table th:first-child{text-align:left;font-size:14px;letter-spacing:.08em}
.oil-table th.latest{color:var(--amber);font-weight:900;border-bottom:2px solid var(--amber)}
.oil-table th.yoy{color:var(--text3);font-style:italic}
.oil-table td{padding:5px 8px;text-align:right;font-size:15px;font-weight:600;border-bottom:1px solid var(--border);color:var(--text2);white-space:nowrap;background:var(--bg)}
.oil-table td:first-child{text-align:left;color:var(--text);font-weight:700}
#vegoils-err{padding:40px;text-align:center;color:var(--red);font-size:14px}
</style>
<script>
const VEGOIL_PANELS = [
  {oil:"Palm Oil",       country:"Indonesia"},
  {oil:"Palm Oil",       country:"Malaysia"},
  {oil:"Soybean Oil",    country:"Argentina"},
  {oil:"Soybean Oil",    country:"Brazil"},
  {oil:"Soybean Oil",    country:"United States"},
  {oil:"Rapeseed Oil",   country:"Canada"},
  {oil:"Rapeseed Oil",   country:"European Union"},
  {oil:"Sunflower Oil",  country:"Ukraine"},
  {oil:"Sunflower Oil",  country:"Russia"},
];
const VEGOIL_HIST_YEARS = 7;

function commodityGroupAllYears(commList){
  const years = new Set();
  commList.forEach(oil=>{
    const countries = DATA[oil];
    if(!countries) return;
    Object.values(countries).forEach(yrs=>Object.keys(yrs).forEach(y=>years.add(y)));
  });
  return [...years].sort();
}
function vegoilAllYears(){ return commodityGroupAllYears(VEGOILS); }

// Sums a given "entity" (e.g. World, or a country/aggregate) across all 4 oils for one year.
// entityFn(oil, year) must return the raw {bs,pr,im,dc,ex,es} object (or null/undefined).
function sumAcrossOils(entityFn, year, commList){
  const list = commList || VEGOILS;
  const keys = ['bs','pr','im','dc','ex','es'];
  const out = {}; let any = false;
  const pOut = {}; let pAny = false;
  keys.forEach(k=>{
    let s = 0, has = false, ps = 0, pHas = false, pMissing = false;
    list.forEach(oil=>{
      const yd = entityFn(oil, year);
      const v = yd ? yd[k] : undefined;
      if(v !== undefined && !isNaN(v)){
        s += v; has = true; any = true;
        const pv = yd._p ? yd._p[k] : undefined;
        if(pv !== undefined && !isNaN(pv)){ ps += pv; pHas = true; } else { pMissing = true; }
      }
    });
    out[k] = has ? s : undefined;
    if(has && pHas && !pMissing){ pOut[k] = ps; pAny = true; }
  });
  if(!any) return null;
  if(pAny) out._p = pOut;
  return out;
}

function buildOilBalanceTable(yearDataFn, years, includeYoy, allYearsFull){
  const latestYear = years[years.length-1];
  const prevYear = years.length>1 ? years[years.length-2] : null;
  const fullYears = allYearsFull || years;
  const stuHistory = fullYears.map(y => getStu(yearDataFn(y))).filter(v => v!==null);
  function stuPctile(y){
    const v = getStu(yearDataFn(y));
    if(v===null || stuHistory.length===0) return null;
    const countLE = stuHistory.filter(x => x<=v).length;
    return (countLE/stuHistory.length)*100;
  }

  const ROWS = [
    {type:'section', label:'Supply'},
    {type:'row', key:'bs', label:'Beginning stocks'},
    {type:'row', key:'pr', label:'Production'},
    {type:'row', key:'im', label:'Imports'},
    {type:'total', keys:['bs','pr','im'], label:'Total supply'},
    {type:'section', label:'Use'},
    {type:'row', key:'dc', label:'Dom. consumption'},
    {type:'row', key:'ex', label:'Exports'},
    {type:'total', keys:['dc','ex'], label:'Total demand'},
    {type:'section', label:'Balance'},
    {type:'row', key:'es', label:'Ending stocks', cls:'row-ending'},
    {type:'stu', label:'Stocks / Use %', cls:'row-stu'},
    {type:'stu_pctile', label:'S/U Percentile Rank (' + fullYears.length + 'yr hist)', cls:'row-pctile'},
  ];

  function valFromYd(row, yd){
    if(row.type==='total') return getTotalRaw(yd, row.keys);
    if(row.type==='stu') return getStu(yd);
    return getRaw(yd, row.key);
  }
  function displayVal(row, y){
    if(row.type==='stu_pctile') return stuPctile(y);
    return valFromYd(row, yearDataFn(y));
  }
  const latestYd = yearDataFn(latestYear);
  const priorYd = latestYd && latestYd._p ? latestYd._p : null;
  function priorCells(row){
    const blank = '<td class="grp-l prior">—</td><td class="prior">—</td>';
    if(row.type==='stu_pctile' || !priorYd) return blank;
    if(row.type==='total' && !row.keys.every(k=>getRaw(priorYd,k)!==null && getRaw(latestYd,k)!==null)) return blank;
    const pv = valFromYd(row, priorYd), cv = valFromYd(row, latestYd);
    if(pv===null) return blank;
    const d = row.type==='stu' ? 1 : 0;
    const chg = cv!==null ? cv - pv : null;
    const pText = row.type==='stu' ? fmtStu(pv) : fmt(pv);
    const cText = chg===null ? '—' : fmtChg(chg, d) + (row.type==='stu' && Number(chg.toFixed(1))!==0 ? 'pp' : '');
    return `<td class="grp-l prior">${pText}</td><td class="${chgClass(chg, d)}">${cText}</td>`;
  }

  let html = `<div class="tbl-wrap"><table class="oil-table"><colgroup><col style="width:190px">`;
  years.forEach(()=>{ html += '<col>'; });
  if(includeYoy) html += '<col style="width:75px"><col style="width:100px"><col style="width:80px">';
  html += `</colgroup><thead><tr><th>ITEM</th>`;
  years.forEach(y=>{ html += `<th class="${y===latestYear?'latest':''}">${y}</th>`; });
  if(includeYoy) html += `<th class="yoy">YoY Δ</th><th class="yoy grp-l">${priorHeader()}</th><th class="yoy">Chg</th>`;
  html += `</tr></thead><tbody>`;

  let alt = false;
  ROWS.forEach(row=>{
    if(row.type==='section'){
      html += `<tr class="row-section"><td colspan="${years.length+1+(includeYoy?3:0)}">${row.label}</td></tr>`;
      alt = false; return;
    }
    const cls = [row.cls||'', alt?'row-alt':''].filter(Boolean).join(' ');
    html += `<tr class="${cls}"><td>${row.label}</td>`;
    alt = !alt;
    const vals = years.map(y=>displayVal(row,y));
    for(let i=0;i<years.length;i++){
      const v = vals[i], prev = i>0?vals[i-1]:null;
      let tdCls = years[i]===latestYear ? 'latest' : '';
      if(row.type!=='stu' && row.type!=='stu_pctile' && v!==null && prev!==null){
        if(v>prev) tdCls += ' up'; else if(v<prev) tdCls += ' dn';
      }
      if(row.type==='stu_pctile' && v!==null){
        tdCls += v<=25 ? ' pctile-tight' : (v>=75 ? ' pctile-loose' : ' pctile-mid');
      }
      const text = row.type==='stu' ? fmtStu(v) : (row.type==='stu_pctile' ? (v===null?'—':ordinal(v)) : fmt(v));
      html += `<td class="${tdCls.trim()}">${text}</td>`;
    }
    if(includeYoy){
      const cur = displayVal(row, latestYear);
      const prev = prevYear ? displayVal(row, prevYear) : null;
      if(row.type==='stu_pctile'){
        html += `<td class="latest">—</td>`;
      } else {
        const yoy = row.type==='stu' ? (cur!==null&&prev!==null?cur-prev:null) : yoyPct(cur,prev);
        let cls = 'latest';
        if(yoy!==null){ cls += yoy>0?' up':(yoy<0?' dn':''); }
        const text = row.type==='stu' ? (yoy===null?'—':(yoy>=0?'+':'')+yoy.toFixed(1)+'pp') : fmtYoy(yoy);
        html += `<td class="${cls}">${text}</td>`;
      }
      html += priorCells(row);
    }
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  return html;
}

function vegoilPanelWrap(title, sub, innerHtml){
  return `<div class="panel"><div class="panel-hdr"><span class="panel-title">${title}</span><span class="panel-sub">${sub}</span></div>${innerHtml}</div>`;
}

function renderVegoilsInto(root){
  const yearsAll = vegoilAllYears();
  const years7 = yearsAll.slice(-VEGOIL_HIST_YEARS);
  if(!years7.length){ root.innerHTML = '<div id="vegoils-err">No vegetable oil data available — has the fetcher picked up Oil, Palm / Oil, Soybean / Oil, Rapeseed / Oil, Sunflowerseed yet?</div>'; return; }

  // World — combined across all 4 oils
  root.insertAdjacentHTML('beforeend', `<div class="sec-hdr">World Balance Sheet — Vegetable Oils (Combined)</div>`);
  root.insertAdjacentHTML('beforeend', vegoilPanelWrap('WORLD', '1000 MT — Palm + Soybean + Rapeseed + Sunflower',
    buildOilBalanceTable(y=>sumAcrossOils((oil,yr)=>(DATA[oil]&&DATA[oil]['World'])?DATA[oil]['World'][yr]:undefined, y), years7, true, yearsAll)));

  // Major Exporters — combined
  root.insertAdjacentHTML('beforeend', `<div class="sec-hdr">Major Exporters — Aggregate (Combined)</div>`);
  root.insertAdjacentHTML('beforeend', vegoilPanelWrap('MAJOR EXPORTERS', VEGOIL_EXPORTERS.join(', '),
    buildOilBalanceTable(y=>sumAcrossOils((oil,yr)=>sumCountries(DATA[oil]||{}, VEGOIL_EXPORTERS, yr), y), years7, true, yearsAll)));

  // Major Importers — combined
  root.insertAdjacentHTML('beforeend', `<div class="sec-hdr">Major Importers — Aggregate (Combined)</div>`);
  root.insertAdjacentHTML('beforeend', vegoilPanelWrap('MAJOR IMPORTERS', VEGOIL_IMPORTERS.join(', '),
    buildOilBalanceTable(y=>sumAcrossOils((oil,yr)=>sumCountries(DATA[oil]||{}, VEGOIL_IMPORTERS, yr), y), years7, true, yearsAll)));

  // Individual oil/country panels — single oil each, not combined
  root.insertAdjacentHTML('beforeend', `<div class="sec-hdr">Individual Exporters — By Oil</div>`);
  const stack = document.createElement('div');
  stack.className = 'stack-wrap';
  VEGOIL_PANELS.forEach(p=>{
    const countries = DATA[p.oil] || {};
    const oilYears = (()=>{ const ys=new Set(); Object.values(countries).forEach(yrs=>Object.keys(yrs).forEach(y=>ys.add(y))); return [...ys].sort(); })();
    const oilYears7 = oilYears.slice(-VEGOIL_HIST_YEARS);
    if(!oilYears7.length) return;
    stack.insertAdjacentHTML('beforeend', vegoilPanelWrap(`${p.country.toUpperCase()} — ${p.oil.toUpperCase()}`, '1000 MT',
      buildOilBalanceTable(y=>(countries[p.country]||{})[y], oilYears7, true, oilYears)));
  });
  root.appendChild(stack);
}

// ---------------- MEAL COMPLEX (Soybean / Rapeseed / Sunflower meal) ----------------
const MEAL_PANELS = [
  {oil:"Soybean Meal",    country:"Argentina"},
  {oil:"Soybean Meal",    country:"Brazil"},
  {oil:"Soybean Meal",    country:"United States"},
  {oil:"Rapeseed Meal",   country:"Canada"},
  {oil:"Rapeseed Meal",   country:"European Union"},
  {oil:"Sunflower Meal",  country:"Ukraine"},
  {oil:"Sunflower Meal",  country:"Russia"},
];
const MEAL_HIST_YEARS = 7;

function renderMealInto(root){
  const yearsAll = commodityGroupAllYears(MEALS);
  const years7 = yearsAll.slice(-MEAL_HIST_YEARS);
  if(!years7.length){ root.innerHTML = '<div id="vegoils-err">No meal data available — has the fetcher picked up Meal, Soybean / Meal, Rapeseed / Meal, Sunflowerseed yet?</div>'; return; }

  root.insertAdjacentHTML('beforeend', `<div class="sec-hdr">World Balance Sheet — Meal (Combined)</div>`);
  root.insertAdjacentHTML('beforeend', vegoilPanelWrap('WORLD', '1000 MT — Soybean + Rapeseed + Sunflower meal',
    buildOilBalanceTable(y=>sumAcrossOils((m,yr)=>(DATA[m]&&DATA[m]['World'])?DATA[m]['World'][yr]:undefined, y, MEALS), years7, true, yearsAll)));

  root.insertAdjacentHTML('beforeend', `<div class="sec-hdr">Major Exporters — Aggregate (Combined)</div>`);
  root.insertAdjacentHTML('beforeend', vegoilPanelWrap('MAJOR EXPORTERS', MEAL_EXPORTERS.join(', '),
    buildOilBalanceTable(y=>sumAcrossOils((m,yr)=>sumCountries(DATA[m]||{}, MEAL_EXPORTERS, yr), y, MEALS), years7, true, yearsAll)));

  root.insertAdjacentHTML('beforeend', `<div class="sec-hdr">Major Importers — Aggregate (Combined)</div>`);
  root.insertAdjacentHTML('beforeend', vegoilPanelWrap('MAJOR IMPORTERS', MEAL_IMPORTERS.join(', '),
    buildOilBalanceTable(y=>sumAcrossOils((m,yr)=>sumCountries(DATA[m]||{}, MEAL_IMPORTERS, yr), y, MEALS), years7, true, yearsAll)));

  root.insertAdjacentHTML('beforeend', `<div class="sec-hdr">Individual Exporters — By Meal</div>`);
  const stack = document.createElement('div');
  stack.className = 'stack-wrap';
  MEAL_PANELS.forEach(p=>{
    const countries = DATA[p.oil] || {};
    const mealYears = commodityGroupAllYears([p.oil]);
    const mealYears7 = mealYears.slice(-MEAL_HIST_YEARS);
    if(!mealYears7.length) return;
    stack.insertAdjacentHTML('beforeend', vegoilPanelWrap(`${p.country.toUpperCase()} — ${p.oil.toUpperCase()}`, '1000 MT',
      buildOilBalanceTable(y=>(countries[p.country]||{})[y], mealYears7, true, mealYears)));
  });
  root.appendChild(stack);
}
</script>
