<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CGC Terminal · Canola & Wheat</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{
  font-family:'Courier New',Courier,monospace;font-size:17px;font-weight:500;min-height:100%;
  background:var(--bg);color:var(--text);font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;transition:background .15s,color .15s;
}
body.dark{
  --bg:#000;--bg1:#060606;--bg2:#0a0a0a;--border:#141414;--border2:#1e1e1e;
  --text:#d4b896;--text2:#8a7a68;--text3:#6a5a4a;
  --amber:#f5a623;--green:#2e8f52;--red:#b83838;
  --th-bg:#040404;--section-bg:#050505;--row-alt:#030303;--row-latest:#0c0800;--grp-line:#4a4034;--ref-color:#8496bd;--ref-bg:rgba(132,150,189,.07);
  --grid:#141414;--band:rgba(212,184,150,.07);
}
body.light{
  --bg:#FFFFFF;--bg1:#F7F8FA;--bg2:#F0F1F4;--border:#E0E2E8;--border2:#C8CCD4;
  --text:#1A1D24;--text2:#3A3F4A;--text3:#6B7280;
  --amber:#B8720A;--green:#0E7A3A;--red:#C4302B;
  --th-bg:#F2F3F6;--section-bg:#ECEDF0;--row-alt:#F7F8FA;--row-latest:#FFF3DC;--grp-line:#9AA1AD;--ref-color:#5b6f94;--ref-bg:rgba(91,111,148,.07);
  --grid:#E0E2E8;--band:rgba(107,114,128,.10);
}
#page-tabs{display:flex;align-items:center;border-bottom:2px solid var(--amber);background:var(--bg);padding-left:16px;gap:6px;flex-wrap:wrap}
.page-tab{flex:0 0 auto;padding:10px 22px;background:none;border:none;color:var(--text3);cursor:pointer;font-family:inherit;font-size:14px;font-weight:900;letter-spacing:.08em}
.page-tab.active{color:var(--amber)}
.page-tab:hover:not(.active){color:var(--text2)}
#topbar{position:sticky;top:0;z-index:10;padding:14px 20px;border-bottom:1px solid var(--amber);background:var(--bg);display:flex;align-items:center;gap:20px;flex-wrap:wrap}
#topbar h1{font-size:18px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);white-space:nowrap}
#meta{font-size:13px;color:var(--text3);letter-spacing:.04em;margin-left:auto;text-align:right;line-height:1.5}
.toggle{display:flex;border:1px solid var(--border2);border-radius:3px;overflow:hidden}
.tbtn{padding:7px 15px;background:none;border:none;color:var(--text3);cursor:pointer;font-family:inherit;font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;transition:all .1s}
.tbtn.active{background:var(--amber);color:#000}
.tbtn:hover:not(.active){color:var(--amber)}
.tbtn.sm{padding:4px 10px;font-size:12px}
#root{max-width:1280px;margin:0 auto;padding:22px}
#banner div{padding:9px 20px;font-size:14px;font-weight:700;letter-spacing:.05em;color:var(--red);border-bottom:1px solid var(--red);background:var(--row-latest)}
.ok{color:var(--green)} .warn{color:var(--amber)}
.panel{border-bottom:2px solid var(--amber);margin-bottom:20px;overflow:hidden}
.panel-hdr{padding:9px 16px;background:var(--bg1);border:1px solid var(--border);border-bottom:none;border-top:3px solid var(--amber);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel-title{font-size:16px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:var(--amber)}
.panel-sub{font-size:13px;color:var(--text3);letter-spacing:.05em}
.panel-hdr .right{margin-left:auto}
.panel-body{border:1px solid var(--border2);background:var(--bg);padding:12px 14px}
.tbl-wrap{overflow-x:auto}
.bal-table{width:100%;border-collapse:collapse;border:1px solid var(--border2);background:var(--bg)}
.bal-table th{background:var(--th-bg);padding:8px 8px;text-align:right;font-size:14px;font-weight:800;letter-spacing:.05em;color:var(--text2);border-bottom:2px solid var(--border2);white-space:nowrap}
.bal-table th:first-child{text-align:left;font-size:14px;letter-spacing:.08em}
.bal-table th.latest{color:var(--amber);font-weight:900;border-bottom:2px solid var(--amber)}
.bal-table th.yoy,.bal-table th.prior{color:var(--text3);font-style:italic}
.bal-table th.sep,.bal-table td.sep{border-left:2px solid var(--border2)}
.bal-table td{padding:5px 8px;text-align:right;font-size:15px;font-weight:600;border-bottom:1px solid var(--border);color:var(--text2);white-space:nowrap;background:var(--bg)}
.bal-table td:first-child{text-align:left;color:var(--text);font-weight:700}
td.latest{color:var(--amber) !important;font-weight:800 !important}
.row-section td{background:var(--section-bg);color:var(--text3) !important;font-size:12px !important;font-weight:900;letter-spacing:.12em;text-transform:uppercase;padding:5px 10px 4px;border-top:1px solid var(--border2)}
.row-total td{font-weight:800;font-size:16px !important;color:var(--amber) !important}
.row-ending td{font-weight:900;font-size:16px !important;color:var(--text) !important;background:var(--row-latest) !important}
.row-stu td{font-style:italic;color:var(--amber) !important;font-size:15px !important}
.row-pctile td{font-style:italic;font-size:13px !important;border-bottom:2px solid var(--border2)}
td.pctile-tight{color:var(--red) !important;font-weight:800 !important}
td.pctile-loose{color:var(--green) !important;font-weight:800 !important}
td.pctile-mid{color:var(--text3) !important}
td.prior{color:var(--text3)}
td.up,span.up{color:var(--green) !important}
td.dn,span.dn{color:var(--red) !important}
td.dim{color:var(--text3) !important;font-weight:500 !important}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--bg1);border:1px solid var(--border2);border-top:3px solid var(--border2);padding:11px 14px;cursor:pointer}
.kpi.on{border-top-color:var(--amber);background:var(--row-latest)}
.kpi:hover:not(.on){border-top-color:var(--text3)}
.kpi .t{color:var(--text3);font-size:12px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}
.kpi .v{font-size:27px;font-weight:900;color:var(--text);margin:5px 0 4px}
.kpi.on .v{color:var(--amber)}
.kpi .v small{font-size:13px;color:var(--text3);font-weight:600}
.kpi .r{display:flex;justify-content:space-between;font-size:13px;color:var(--text2);margin-top:2px}
.kpi .proj{margin-top:7px;padding-top:7px;border-top:1px dashed var(--border2);font-size:13px;color:var(--text2);display:flex;justify-content:space-between}
.kpi .proj b{color:var(--amber);font-weight:900}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.grid2 .panel{margin-bottom:0}
@media(max-width:960px){.grid2{grid-template-columns:1fr}}
.chart{position:relative;height:320px}
.note{color:var(--text3);font-size:12px;margin-top:22px;line-height:1.7}
a{color:var(--ref-color)}
#err{padding:40px;text-align:center;color:var(--red);font-size:16px}
</style>
</head>
<body class="dark">
<div id="page-tabs">
  <div class="toggle" id="theme-toggle"><button class="tbtn sm" data-t="dark">Dark</button><button class="tbtn sm" data-t="light">Light</button></div>
  <button class="page-tab active" data-page="cgc">CGC WEEKLY</button>
  <button class="page-tab" data-page="sd">S&amp;D BALANCE SHEET</button>
</div>
<div id="topbar">
  <h1 id="title">CGC Grain Statistics</h1>
  <div class="toggle" id="grain-toggle"></div>
  <div id="meta">loading…</div>
</div>
<div id="banner"></div>
<div id="root"></div>

<script>
/* =========================================================== config */
const GRAINS = [
  {k:'canola', n:'CANOLA', crush:'CRUSH', fi:'Crush (food & industrial)'},
  {k:'wheat',  n:'WHEAT',  crush:'MILLED', fi:'Food & industrial', sub:'ex-durum'},
];
const METRICS = [
  {k:'exp', n:'EXPORTS',                flow:true, proj:true},
  {k:'dom', n:'DOMESTIC DISAPPEARANCE', flow:true, proj:true},
  {k:'stk', n:'COMMERCIAL STOCKS',      flow:false},
  {k:'del', n:'PRODUCER DELIVERIES',    flow:true},
];
let D=null, S=null, charts=[];
const state = {page:'cgc', tab:'canola', metric:'exp', zoom:false};

/* =========================================================== helpers */
const fmt = (v,d=1) => v==null||isNaN(v) ? '–' : v.toLocaleString('en-CA',{minimumFractionDigits:d,maximumFractionDigits:d});
const pct = (a,b) => (a==null||b==null||!b) ? null : (a/b-1)*100;
const pctHtml = p => p==null ? '<span>–</span>' : `<span class="${p>=0?'up':'dn'}">${p>=0?'+':''}${p.toFixed(1)}%</span>`;
const pctTd = p => p==null ? '<td>–</td>' : `<td class="${p>=0?'up':'dn'}">${p>=0?'+':''}${p.toFixed(1)}%</td>`;
const at = (arr,w) => arr && arr[w-1]!=null ? arr[w-1] : null;
const mean = xs => { xs = xs.filter(x=>x!=null); return xs.length ? xs.reduce((a,b)=>a+b,0)/xs.length : null; };
const label = cy => cy.slice(2,4)+'/'+cy.slice(7,9);
const css = v => getComputedStyle(document.body).getPropertyValue(v).trim();
const fdate = d => d ? new Date(d+'T12:00:00').toLocaleDateString('en-CA',{month:'short',day:'numeric',year:'numeric'}) : '';
const sdate = d => d ? new Date(d+'T12:00:00').toLocaleDateString('en-CA',{month:'short',day:'numeric'}) : '';
const ordinal = n => { const s=['th','st','nd','rd'], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); };

/* =========================================================== theme + nav */
function getTheme(){ try{ return localStorage.getItem('cgc-theme')||'dark'; }catch(e){ return 'dark'; } }
function setTheme(t){
  document.body.classList.toggle('dark', t==='dark'); document.body.classList.toggle('light', t==='light');
  document.querySelectorAll('#theme-toggle .tbtn').forEach(b=>b.classList.toggle('active', b.dataset.t===t));
  try{ localStorage.setItem('cgc-theme', t); }catch(e){}
}
setTheme(getTheme());
document.querySelectorAll('#theme-toggle .tbtn').forEach(b=>b.onclick=()=>{ setTheme(b.dataset.t); render(); });
document.querySelectorAll('.page-tab').forEach(b=>b.onclick=()=>{
  state.page=b.dataset.page;
  document.querySelectorAll('.page-tab').forEach(x=>x.classList.toggle('active', x===b));
  render();
});
function renderGrainToggle(){
  const el=document.getElementById('grain-toggle');
  el.innerHTML = GRAINS.map(g=>`<button class="tbtn ${state.tab===g.k?'active':''}" data-k="${g.k}">${g.n}</button>`).join('');
  el.querySelectorAll('.tbtn').forEach(b=>b.onclick=()=>{ state.tab=b.dataset.k; render(); });
}
function panel(title, sub, right, body){
  return `<div class="panel"><div class="panel-hdr"><span class="panel-title">${title}</span><span class="panel-sub">${sub||''}</span>${right?`<span class="right">${right}</span>`:''}</div>${body}</div>`;
}

/* =========================================================== CGC data access */
const _fill = {};
function interp(a){          // fill interior holiday-gap weeks in cumulative / level series
  if (!a) return a; const o=a.slice(); let last=-1;
  for (let i=0;i<o.length;i++){ if (o[i]==null) continue;
    if (last>=0 && i-last>1) for (let j=last+1;j<i;j++) o[j]=o[last]+(o[i]-o[last])*(j-last)/(i-last);
    last=i; }
  return o;
}
function series(g, cy, key){
  const a=(D.grains[g][cy]||{})[key];
  if (!a || !(/_cy$/.test(key) || /^stk/.test(key) || /^port_cy|^delprov/.test(key))) return a;
  const k=g+'|'+cy+'|'+key; return _fill[k] || (_fill[k]=interp(a));
}
function hist(){ return D.years.slice(1); }
function ly(){ return D.years[1]; }
function val(g, cy, m, w, mode){ return m==='stk' ? at(series(g,cy,'stk'), w) : at(series(g,cy, m+'_'+(mode||'cy')), w); }
function avg5(g, m, w, mode){ return mean(hist().map(cy => val(g,cy,m,w,mode))); }
function maxWeeks(){ const n=Math.max(...D.years.map(cy=>(D.dates[cy]||[]).length)); return Array.from({length:n},(_,i)=>i+1); }
function avgSeries(g,m,mode){ return maxWeeks().map(w=>avg5(g,m,w,mode)); }
function bandSeries(g,key){
  const H=hist(), W=maxWeeks(), vals = w => H.map(cy=>at(series(g,cy,key),w)).filter(x=>x!=null);
  return {max:W.map(w=>{const v=vals(w);return v.length?Math.max(...v):null}), min:W.map(w=>{const v=vals(w);return v.length?Math.min(...v):null})};
}
/* seasonal pace: current CYTD ÷ avg share of full-year total done by this week in prior years */
function finalOf(g, cy, m){ const a = series(g,cy,m+'_cy')||[]; for(let i=a.length-1;i>=0;i--) if(a[i]!=null) return a[i]; return null; }
function shareAt(g, cy, m, w){ const f=finalOf(g,cy,m), v=val(g,cy,m,w,'cy'); return (f && v!=null) ? v/f : null; }
function projection(g, m){
  const w = D.latest_week, cur = val(g,D.current,m,w,'cy');
  const H = hist().filter(cy => (D.dates[cy]||[]).length >= 50);
  const shares = H.map(cy=>shareAt(g,cy,m,w)).filter(x=>x);
  if (!cur || !shares.length) return null;
  const avgShare = mean(shares), implied = cur/avgShare, each = shares.map(s=>cur/s);
  const line = maxWeeks().map(x => x < w ? null : (x===w ? cur : (()=>{ const sh=mean(H.map(cy=>shareAt(g,cy,m,x)).filter(v=>v)); return sh ? implied*sh : null; })()));
  return {implied, lo:Math.min(...each), hi:Math.max(...each), avgShare, line, cur, lyFinal:finalOf(g,ly(),m), n:shares.length};
}

/* =========================================================== boot */
Promise.all([
  fetch('data/cgc.json?'+Date.now()).then(r=>r.ok?r.json():null).catch(()=>null),
  fetch('data/sd.json?'+Date.now()).then(r=>r.ok?r.json():null).catch(()=>null),
]).then(([c,s])=>{ D=c; S=s; render(); });

function render(){
  charts.forEach(c=>c.destroy()); charts=[];
  renderGrainToggle();
  const g = GRAINS.find(x=>x.k===state.tab);
  document.getElementById('banner').innerHTML='';
  if (state.page==='cgc') renderCGC(g); else renderSD(g);
}

/* =========================================================== CGC page */
function cgcMeta(){
  const v = D.verified, ok = v && v.week===D.latest_week && v.crop_year===D.current;
  const tag = ok ? `<span class="ok" title="Latest week matched ${v.cells} figures on the official CGC Excel Summary tab (max diff ${v.max_diff} kt)">✓ VERIFIED vs CGC SUMMARY (${v.cells}/${v.cells})</span>` : `<span class="warn">NOT VERIFIED</span>`;
  return `CY ${D.current} · WEEK ${D.latest_week} · ending ${fdate(D.latest_date)}<br>${tag} · updated ${D.updated.replace('T',' ').slice(0,16)} UTC · <a href="${D.source_url}" target="_blank">CGC GSW</a>`;
}
function renderCGC(g){
  document.getElementById('title').textContent = 'CGC Grain Statistics';
  const root = document.getElementById('root');
  if (!D){ document.getElementById('meta').textContent=''; root.innerHTML='<div id="err">Could not load data/cgc.json — run the GitHub Action once.</div>'; return; }
  document.getElementById('meta').innerHTML = cgcMeta();
  const age = D.latest_date ? Math.floor((Date.now() - new Date(D.latest_date+'T12:00:00'))/864e5) : 999;
  if (age > 12) document.getElementById('banner').innerHTML = `<div>⚠ DATA STALE — latest CGC week ended ${fdate(D.latest_date)} (${age} days ago). The weekly update has likely failed — check the repo's Actions tab.</div>`;

  const w = D.latest_week, m = METRICS.find(x=>x.k===state.metric);
  const kpis = METRICS.map(x=>{
    const mode = x.flow?'cy':null;
    const cur=val(g.k,D.current,x.k,w,mode), l=val(g.k,ly(),x.k,w,mode), a=avg5(g.k,x.k,w,mode);
    const wk = x.flow ? val(g.k,D.current,x.k,w,'wk') : null, wkl = x.flow ? val(g.k,ly(),x.k,w,'wk') : null;
    return `<div class="kpi ${state.metric===x.k?'on':''}" data-m="${x.k}">
      <div class="t">${x.n} · ${x.flow?'CYTD':'LEVEL'}</div>
      <div class="v">${fmt(cur)} <small>kt</small></div>
      <div class="r"><span>vs LY ${pctHtml(pct(cur,l))}</span><span>vs avg ${pctHtml(pct(cur,a))}</span></div>
      <div class="r"><span>${x.flow?'Wk '+w+': '+fmt(wk):'Chg wk: '+fmtChg(val(g.k,D.current,'stk',w),val(g.k,D.current,'stk',w-1))}</span><span>${x.flow?'LY wk: '+fmt(wkl):'LY: '+fmt(l)}</span></div>
      ${x.proj ? projRow(g.k,x.k) : ''}
    </div>`;
  }).join('');

  root.innerHTML = `
  <div class="kpis">${kpis}</div>
  ${panel('LAST 10 WEEKS', g.n+(g.sub?' · '+g.sub:'')+' · 1000 MT', '', `<div class="tbl-wrap">${recentTable(g)}</div>`)}
  <div class="grid2">
    ${panel(m.n, (m.flow?'CYTD':'level')+' · 1000 MT'+(m.proj?' · dotted = seasonal pace':''),
      `<div class="toggle"><button class="tbtn sm ${state.zoom?'active':''}" id="zb">Zoom</button><button class="tbtn sm ${state.zoom?'':'active'}" id="fb">Full yr</button></div>`,
      `<div class="panel-body"><div class="chart"><canvas id="c1"></canvas></div></div>`)}
    ${panel(m.flow?m.n+' · WEEKLY':'STOCKS BY LOCATION', '1000 MT', '', `<div class="panel-body"><div class="chart"><canvas id="c2"></canvas></div></div>`)}
  </div>
  <div class="grid2">
    ${panel('EXPORTS BY PORT', 'terminal · 1000 MT', '', `<div class="tbl-wrap">${portTable(g.k)}</div>`)}
    ${panel('DELIVERIES BY PROVINCE', 'primary elevators · CYTD · 1000 MT', '', `<div class="tbl-wrap">${provTable(g.k)}</div>`)}
  </div>
  ${cgcNotes()}`;

  root.querySelectorAll('.kpi').forEach(el=>el.onclick=()=>{state.metric=el.dataset.m; render();});
  document.getElementById('zb').onclick=()=>{state.zoom=true; render();};
  document.getElementById('fb').onclick=()=>{state.zoom=false; render();};

  const wks = maxWeeks(), H = hist(), key = m.flow ? m.k+'_cy' : 'stk', band = bandSeries(g.k, key);
  const P = m.proj ? projection(g.k, m.k) : null;
  charts.push(lineChart('c1', wks, [
    ds(label(D.current), series(g.k,D.current,key), css('--amber'), null, 3),
    ...(P ? [ds(`${label(D.current)} seasonal pace → ${fmt(P.implied,0)}`, P.line, css('--amber'), [5,4], 2)] : []),
    ds(label(ly()), series(g.k,ly(),key), css('--ref-color')),
    ds(H.length+'-yr avg', avgSeries(g.k,m.k, m.flow?'cy':null), css('--text3'), [4,3]),
    {label:'range max', data:band.max, borderWidth:0, pointRadius:0, fill:'+1', backgroundColor:css('--band')},
    {label:'range min', data:band.min, borderWidth:0, pointRadius:0, fill:false},
  ]));
  if (state.zoom){ const c=charts[charts.length-1]; c.options.scales.x.max=Math.min(wks.length-1, D.latest_week+7); c.update(); }

  if (m.flow){
    charts.push(new Chart(document.getElementById('c2'), {
      data:{labels:wks, datasets:[
        {type:'bar', label:label(D.current), data:series(g.k,D.current,m.k+'_wk')||[], backgroundColor:css('--amber')},
        {type:'bar', label:label(ly()), data:series(g.k,ly(),m.k+'_wk'), backgroundColor:css('--ref-color')+'99'},
        {type:'line', label:H.length+'-yr avg', data:avgSeries(g.k,m.k,'wk'), borderColor:css('--text3'), borderDash:[4,3], pointRadius:0, borderWidth:1.5},
      ]}, options:chartOpts()}));
  } else {
    const n = D.dates[D.current].length;
    charts.push(new Chart(document.getElementById('c2'), {type:'bar',
      data:{labels:wks.slice(0,n), datasets:[
        {label:'Primary', data:series(g.k,D.current,'stk_primary'), backgroundColor:css('--amber')},
        {label:'Process', data:series(g.k,D.current,'stk_process'), backgroundColor:css('--green')},
        {label:'Terminal', data:series(g.k,D.current,'stk_terminal'), backgroundColor:css('--ref-color')},
      ]}, options:chartOpts(true)}));
  }
}
function projRow(g,m){
  const P = projection(g,m); if (!P) return '';
  return `<div class="proj" title="Current CYTD ÷ avg share of the full-year total done by week ${D.latest_week} in the prior ${P.n} crop years (${(P.avgShare*100).toFixed(0)}%). Range uses each year's share alone.">
    <span>Seasonal pace →</span><b>${fmt(P.implied,0)}</b></div>
    <div class="r"><span>range</span><span>${fmt(P.lo,0)}–${fmt(P.hi,0)}</span></div>
    <div class="r"><span>vs LY final ${pctHtml(pct(P.implied,P.lyFinal))}</span><span>LY ${fmt(P.lyFinal,0)}</span></div>`;
}
function fmtChg(a,b){ if(a==null||b==null) return '–'; const d=a-b; return `<span class="${d>=0?'up':'dn'}">${d>=0?'+':''}${fmt(d)}</span>`; }
function portTable(g){
  const w=D.latest_week; let tw=0,tc=0,tl=0;
  const rows = D.ports.map(p=>{
    const wk=at(series(g,D.current,'port_wk_'+p),w)||0, c=at(series(g,D.current,'port_cy_'+p),w)||0, l=at(series(g,ly(),'port_cy_'+p),w)||0;
    tw+=wk; tc+=c; tl+=l;
    return `<tr><td>${p}</td><td>${fmt(wk)}</td><td>${fmt(c)}</td><td class="prior">${fmt(l)}</td>${pctTd(pct(c,l))}</tr>`;
  }).join('');
  const dc=val(g,D.current,'expdirect',w,'cy')||0, dl=val(g,ly(),'expdirect',w,'cy')||0, dw=val(g,D.current,'expdirect',w,'wk')||0;
  return `<table class="bal-table"><thead><tr><th>PORT</th><th>WK ${w}</th><th class="latest">CYTD</th><th class="prior">LY CYTD</th><th class="yoy">vs LY</th></tr></thead><tbody>${rows}
   <tr class="row-total"><td>Terminal total</td><td>${fmt(tw)}</td><td>${fmt(tc)}</td><td>${fmt(tl)}</td>${pctTd(pct(tc,tl))}</tr>
   <tr><td>Direct (primaries + prod. cars)</td><td>${fmt(dw)}</td><td>${fmt(dc)}</td><td class="prior">${fmt(dl)}</td>${pctTd(pct(dc,dl))}</tr>
   <tr class="row-ending"><td>Total exports</td><td>${fmt(tw+dw)}</td><td>${fmt(tc+dc)}</td><td>${fmt(tl+dl)}</td>${pctTd(pct(tc+dc,tl+dl))}</tr></tbody></table>`;
}
function provTable(g){
  const w=D.latest_week; let tc=0,tl=0;
  const rows = D.provs.map(p=>{
    const c=at(series(g,D.current,'delprov_'+p),w)||0, l=at(series(g,ly(),'delprov_'+p),w)||0; tc+=c; tl+=l;
    return `<tr><td>${p}</td><td>${fmt(c)}</td><td class="prior">${fmt(l)}</td>${pctTd(pct(c,l))}</tr>`;
  }).join('');
  const pc=(val(g,D.current,'del',w,'cy')||0)-tc, pl=(val(g,ly(),'del',w,'cy')||0)-tl;
  return `<table class="bal-table"><thead><tr><th>PROV</th><th class="latest">CYTD</th><th class="prior">LY CYTD</th><th class="yoy">vs LY</th></tr></thead><tbody>${rows}
  <tr class="row-total"><td>Primary elevators</td><td>${fmt(tc)}</td><td>${fmt(tl)}</td>${pctTd(pct(tc,tl))}</tr>
  <tr><td>Process elev. + prod. cars</td><td>${fmt(pc)}</td><td class="prior">${fmt(pl)}</td>${pctTd(pct(pc,pl))}</tr>
  <tr class="row-ending"><td>Total producer deliveries</td><td>${fmt(tc+pc)}</td><td>${fmt(tl+pl)}</td>${pctTd(pct(tc+pc,tl+pl))}</tr></tbody></table>`;
}
function recentTable(g){
  const n=D.latest_week, from=Math.max(1,n-9); let r='';
  for(let w=n; w>=from; w--){
    const c = w===n ? ' class="latest"' : '';
    r+=`<tr><td>${w} · ${sdate(D.dates[D.current][w-1])}</td>
      <td${c}>${fmt(val(g.k,D.current,'exp',w,'wk'))}</td><td${c}>${fmt(val(g.k,D.current,'dom',w,'wk'))}</td><td${c}>${fmt(val(g.k,D.current,'crush',w,'wk'))}</td>
      <td${c}>${fmt(val(g.k,D.current,'stk',w))}</td><td${c}>${fmt(val(g.k,D.current,'del',w,'wk'))}</td><td${c}>${fmt(val(g.k,D.current,'rcpt',w,'wk'))}</td></tr>`;
  }
  return `<table class="bal-table"><thead><tr><th>WEEK</th><th>EXPORTS</th><th>DOM. DISAPP.</th><th>${g.crush}</th><th>STOCKS</th><th>DELIVERIES</th><th>TERM. RECEIPTS</th></tr></thead><tbody>${r}</tbody></table>`;
}
function cgcNotes(){
  return `<div class="note">
  Source: Canadian Grain Commission, Grain Statistics Weekly (licensed facilities). Thousand tonnes. Avg = prior ${hist().length} crop years (${hist().map(label).join(', ')}), aligned by grain week.
  Figures match the GSW Excel Summary tab. Deliveries = primary + process elevator producer deliveries + producer cars.
  Domestic disappearance = process elevator use (canola crush / wheat milled) + terminal and primary shipments to Canadian domestic + producer cars to Canadian processors.
  Exports = terminal exports + direct exports from primary elevators + producer cars to US. Stocks = commercial stocks at primary, process and terminal elevators (excl. condo storage).
  Seasonal pace (dotted line) = current CYTD ÷ average share of the full-year total completed by this week in the prior crop years, traced forward along the average seasonal curve; range = same calc using each prior year alone. Arithmetic pace, not a forecast.
  Wheat excludes durum. History uses CGC's revised crop-year files; CGC publishes no report for some Christmas weeks (wk 21 in several years) — weekly bars show the gap, cumulative and stock lines interpolate across it.</div>`;
}

/* =========================================================== chart helpers */
function ds(lbl,data,color,dash,width){ return {label:lbl, data, borderColor:color, backgroundColor:color, borderDash:dash||[], borderWidth:width||1.75, pointRadius:0, tension:.15, spanGaps:true}; }
function chartOpts(stacked){
  const F="'Courier New',monospace", grid={color:css('--grid')}, tick={color:css('--text3'),font:{family:F,size:12,weight:'bold'}};
  return {responsive:true, maintainAspectRatio:false, animation:false, interaction:{mode:'index',intersect:false},
    plugins:{legend:{labels:{color:css('--text2'),boxWidth:12,font:{family:F,size:12,weight:'bold'}, filter:i=>!/^range/.test(i.text)}},
      tooltip:{filter:i=>!/^range/.test(i.dataset.label), titleFont:{family:F}, bodyFont:{family:F},
        callbacks:{title:t=>'Week '+t[0].label, label:c=>`${c.dataset.label}: ${fmt(c.parsed.y)}`}}},
    scales:{x:{stacked:!!stacked,grid,ticks:{...tick,maxTicksLimit:14},title:{display:true,text:'GRAIN WEEK',color:css('--text3'),font:{family:F,size:11,weight:'bold'}}},
            y:{stacked:!!stacked,grid,ticks:{...tick,callback:v=>v.toLocaleString()}}}};
}
function lineChart(id,labels,datasets){ return new Chart(document.getElementById(id),{type:'line',data:{labels,datasets},options:chartOpts()}); }

/* =========================================================== S&D page */
const SD_ROWS = [
  {k:'ac_harv', n:'Area harvested (1000 ac)', d:0},
  {k:'bu_ac',   n:'Yield (bu/ac)', d:1},
  {sec:'SUPPLY'},
  {k:'beg',  n:'Beginning stocks'},
  {k:'prod', n:'Production'},
  {k:'imp',  n:'Imports'},
  {k:'supply', n:'Total supply', cls:'row-total'},
  {sec:'USE'},
  {k:'exp', n:'Exports'},
  {k:'fi',  n:'FI'},
  {k:'fwd', n:'Feed, waste & dockage'},
  {k:'seed_other', n:'Seed & other'},
  {k:'dom', n:'Total domestic use', cls:'row-total'},
  {k:'total_use', n:'Total demand', cls:'row-total'},
  {sec:'BALANCE'},
  {k:'end', n:'Ending stocks', cls:'row-ending'},
  {k:'su',  n:'Stocks / Use %', cls:'row-stu', pctv:true},
  {k:'_rank', n:'S/U Percentile Rank', cls:'row-pctile'},
  {sec:'PRICE'},
  {k:'price', n:'AAFC avg price ($/t)', d:0},
];

function renderSD(g){
  document.getElementById('title').textContent = 'Canadian Balance Sheets';
  const root = document.getElementById('root');
  if (!S){ document.getElementById('meta').textContent=''; root.innerHTML='<div id="err">Could not load data/sd.json — run the GitHub Action once.</div>'; return; }
  document.getElementById('meta').innerHTML =
    `AAFC Outlook ${fdate(S.aafc.date)} (prior ${sdate(S.aafc.prior_date)}) · StatsCan final through ${S.statcan_latest}<br>
     <span class="ok" title="Every balance sheet shown adds up: beginning + production + imports = supply = exports + domestic + ending">✓ ${S.checks.sheets} BALANCE SHEETS VERIFIED</span> · updated ${S.updated.replace('T',' ').slice(0,16)} UTC · <a href="${S.aafc.url}" target="_blank">AAFC</a>`;
  const ageDays = Math.floor((Date.now() - new Date(S.aafc.date+'T12:00:00'))/864e5);
  if (ageDays > 40) document.getElementById('banner').innerHTML = `<div>⚠ AAFC OUTLOOK IS ${ageDays} DAYS OLD — a newer monthly report should exist; check the repo's Actions tab.</div>`;

  const C = S.crops[g.k], Y = C.years, fc = C.forecast_year, P = C.prior;
  const statYears = Object.keys(Y).filter(cy=>Y[cy].src==='StatsCan');
  const estYears  = C.aafc_years.filter(cy=>cy!==fc && Y[cy].src==='AAFC');
  const cols = [...statYears.slice(-6), ...estYears, fc];
  const prevCy = cy => { const s=+cy.slice(0,4)-1; return `${s}-${s+1}`; };

  const suHist = statYears.map(cy=>Y[cy].su).filter(x=>x!=null);
  const rank = su => su==null ? null : Math.round(100 * suHist.filter(x=>x<=su).length / suHist.length);
  const rankCell = (su, sep) => { const r=rank(su); if (r==null) return `<td${sep?' class="sep"':''}>–</td>`;
    const c = r<=25?'pctile-tight':r>=75?'pctile-loose':'pctile-mid'; return `<td class="${c}${sep?' sep':''}">${ordinal(r)}</td>`; };

  const head = `<tr><th>ITEM</th>${cols.map(cy=>`<th class="${cy===fc?'latest':''}">${label(cy)}${cy===fc?' f':(estYears.includes(cy)?' e':'')}</th>`).join('')}
    <th class="yoy">YoY Δ</th><th class="prior sep">Prior ${sdate(S.aafc.prior_date)}</th><th class="prior">Chg</th></tr>`;

  let body = '';
  for (const r of SD_ROWS){
    if (r.sec){ body += `<tr class="row-section"><td colspan="${cols.length+4}">${r.sec}</td></tr>`; continue; }
    const name = r.k==='fi' ? g.fi : (r.k==='_rank' ? `S/U Percentile Rank (${suHist.length}yr hist)` : r.n);
    const d = r.d!=null ? r.d : (r.pctv?1:0);
    const show = v => v==null ? '–' : (r.pctv ? fmt(v,1)+'%' : fmt(v,d));
    let cells = '';
    cols.forEach((cy,i)=>{
      if (r.k==='_rank'){ cells += rankCell(Y[cy].su); return; }
      const v = Y[cy][r.k], pv = i>0 ? Y[cols[i-1]][r.k] : null;
      let cls = cy===fc ? 'latest' : '';
      if (!cls && !r.cls && v!=null && pv!=null) cls = v>pv ? 'up' : (v<pv ? 'dn' : '');
      cells += `<td class="${cls}">${show(v)}</td>`;
    });
    const cur = Y[fc][r.k], py = Y[prevCy(fc)] ? Y[prevCy(fc)][r.k] : null;
    let yoy='<td>–</td>', pr='<td class="prior sep">–</td>', ch='<td>–</td>';
    if (r.k==='_rank'){ pr = P ? rankCell(P.su, true) : pr; }
    else {
      if (cur!=null && py!=null) yoy = r.pctv ? `<td class="${cur-py>=0?'up':'dn'}">${cur-py>=0?'+':''}${(cur-py).toFixed(1)}pp</td>` : pctTd(pct(cur,py));
      const pv = P ? P[r.k] : null;
      if (pv!=null && cur!=null){
        pr = `<td class="prior sep">${show(pv)}</td>`;
        const dd = cur-pv, zero = Math.abs(dd) < (r.pctv||d ? 0.05 : 0.5);
        ch = zero ? '<td class="dim">0</td>' : `<td class="${dd>0?'up':'dn'}">${dd>0?'+':''}${r.pctv?dd.toFixed(1)+'pp':fmt(dd,d)}</td>`;
      }
    }
    body += `<tr class="${r.cls||''}"><td>${name}</td>${cells}${yoy}${pr}${ch}</tr>`;
  }

  root.innerHTML = `
  ${panel('CANADA · '+g.n+(g.sub?' ('+g.sub+')':''), `crop year Aug–Jul · 1000 MT · history StatsCan · ${label(fc)} f = AAFC ${sdate(S.aafc.date)}`, '',
      `<div class="tbl-wrap"><table class="bal-table"><thead>${head}</thead><tbody>${body}</tbody></table></div>`)}
  ${paceVsAafc(g, C)}
  ${S.checks.notes && S.checks.notes.length ? `<div class="note">Data notes: ${S.checks.notes.join(' · ')}</div>` : ''}
  <div class="note">
    History = Statistics Canada table 32-10-0013 (supply &amp; disposition, final) and 32-10-0359 (harvested area, yield) — revised actuals back to 1996-97.
    ${label(fc)} f = AAFC "Canada: Outlook for Principal Field Crops" (${fdate(S.aafc.date)}); Prior / Chg = vs the previous AAFC report (${fdate(S.aafc.prior_date)}).
    ${estYears.length?'e = AAFC estimate for a year StatsCan hasn\'t finalised yet. ':''}
    Exports: canola = seed only; wheat includes grain products (AAFC/StatsCan definitions). Canola food &amp; industrial is essentially crush. Seed &amp; other = seed use + loss in handling.
    Cell colours compare each year with the one before. S/U percentile ranks stocks-to-use against every StatsCan year since 1996-97 (low = tight = red). AAFC price: canola = AAFC crop-year average; wheat = No. 1 CWRS 13.5% Sask. producer spot.
  </div>`;
}

/* AAFC forecast vs CGC weekly pace (same crop year only) */
function paceVsAafc(g, C){
  if (!D) return '';
  const fc = C.forecast_year;
  if (fc !== D.current) return '';
  const Y = C.years, lyCy = D.years[1];
  const rows = [{m:'exp', n:'Exports', a:Y[fc].exp, lyStc: Y[lyCy] && Y[lyCy].exp}];
  if (g.k==='canola') rows.push({m:'crush', n:'Crush vs AAFC F&I', a:Y[fc].fi, lyStc: Y[lyCy] && Y[lyCy].fi});
  const body = rows.map(r=>{
    const P = projection(g.k, r.m); if (!P || !r.a) return '';
    const lyCgc = finalOf(g.k, lyCy, r.m), ratio = (lyCgc && r.lyStc) ? r.lyStc/lyCgc : null;
    const adj = ratio ? P.implied*ratio : null, diff = adj!=null ? adj - r.a : null;
    return `<tr><td>${r.n}</td><td class="latest">${fmt(r.a,0)}</td><td>${fmt(P.cur,0)}</td><td>${fmt(P.cur/r.a*100,1)}%</td><td>${fmt(P.avgShare*100,1)}%</td>
      <td>${fmt(P.implied,0)}</td><td class="prior" title="${label(lyCy)}: StatsCan ${fmt(r.lyStc,0)} ÷ CGC ${fmt(lyCgc,0)}">${ratio?ratio.toFixed(3):'–'}</td>
      <td class="latest">${fmt(adj,0)}</td>${diff==null?'<td>–</td>':`<td class="${diff>=0?'up':'dn'}">${diff>=0?'+':''}${fmt(diff,0)}</td>`}</tr>`;
  }).join('');
  return panel('AAFC FORECAST vs CGC WEEKLY PACE', `${label(fc)} · CGC week ${D.latest_week} · 1000 MT`, '',
    `<div class="tbl-wrap"><table class="bal-table"><thead><tr><th>ITEM</th><th class="latest">AAFC ${label(fc)} F</th><th>CGC CYTD</th><th>% OF AAFC</th><th>NORMAL % BY WK ${D.latest_week}</th>
      <th>PACE (CGC)</th><th class="prior">LY STC÷CGC</th><th class="latest">PACE (STC BASIS)</th><th class="yoy">vs AAFC</th></tr></thead><tbody>${body}</tbody></table></div>
     <div class="note" style="margin:10px 2px 4px">Pace = CGC CYTD ÷ normal share of the year done by this week (prior ${hist().length} yrs). CGC counts licensed facilities only, so pace is rescaled by last year's StatsCan÷CGC ratio to put it on the same basis as AAFC before comparing.</div>`);
}
</script>
