<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>USDA Balance Sheets</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{
  font-family:'Courier New',Courier,monospace;font-size:17px;font-weight:500;min-height:100%;
  background:var(--bg);color:var(--text);font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  transition:background .15s,color .15s;
}
body.dark{
  --bg:#000;--bg1:#060606;--bg2:#0a0a0a;--border:#141414;--border2:#1e1e1e;
  --text:#d4b896;--text2:#8a7a68;--text3:#6a5a4a;
  --amber:#f5a623;--green:#2e8f52;--red:#b83838;
  --th-bg:#040404;--section-bg:#050505;--row-alt:#030303;--row-latest:#0c0800;--grp-line:#4a4034;--ref-color:#8496bd;--ref-bg:rgba(132,150,189,.07);
}
body.light{
  --bg:#FFFFFF;--bg1:#F7F8FA;--bg2:#F0F1F4;--border:#E0E2E8;--border2:#C8CCD4;
  --text:#1A1D24;--text2:#3A3F4A;--text3:#6B7280;
  --amber:#B8720A;--green:#0E7A3A;--red:#C4302B;
  --th-bg:#F2F3F6;--section-bg:#ECEDF0;--row-alt:#F7F8FA;--row-latest:#FFF3DC;--grp-line:#9AA1AD;--ref-color:#5b6f94;--ref-bg:rgba(91,111,148,.07);
}
#topbar{position:sticky;top:0;z-index:10;padding:14px 20px;border-bottom:1px solid var(--amber);background:var(--bg);display:flex;align-items:center;gap:20px;flex-wrap:wrap}
#topbar h1{font-size:18px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);white-space:nowrap}
#conv-label{font-size:12px;color:var(--text3);letter-spacing:.04em;white-space:nowrap}
#meta{font-size:13px;color:var(--text3);letter-spacing:.04em;margin-left:auto}
.toggle{display:flex;border:1px solid var(--border2);border-radius:3px;overflow:hidden}
.tbtn{padding:7px 15px;background:none;border:none;color:var(--text3);cursor:pointer;font-family:inherit;font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;transition:all .1s}
.tbtn.active{background:var(--amber);color:#000}
.tbtn:hover:not(.active){color:var(--amber)}
#root{max-width:1280px;margin:0 auto;padding:22px}
.sec-hdr{font-size:15px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);padding:16px 0 9px;border-bottom:2px solid var(--amber);margin:32px 0 14px}
.sec-hdr:first-child{margin-top:0}
.panel{border-bottom:2px solid var(--amber);margin-bottom:20px;overflow:hidden}
.panel-hdr{padding:9px 16px;background:var(--bg1);border:1px solid var(--border);border-bottom:none;border-top:3px solid var(--amber)}
.panel-title{font-size:16px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:var(--amber)}
.panel-sub{font-size:13px;color:var(--text3);letter-spacing:.05em;margin-left:8px}
.tbl-wrap{overflow-x:auto}
.bal-table{width:100%;border-collapse:collapse;border:1px solid var(--border2);background:var(--bg)}
.bal-table th{background:var(--th-bg);padding:8px 8px;text-align:right;font-size:14px;font-weight:800;letter-spacing:.05em;color:var(--text2);border-bottom:2px solid var(--border2);white-space:nowrap}
.bal-table th:first-child{text-align:left;font-size:14px;letter-spacing:.08em}
.bal-table th.latest{color:var(--amber);font-weight:900;border-bottom:2px solid var(--amber)}
.bal-table th.yoy{color:var(--text3);font-style:italic}
.bal-table td{padding:5px 8px;text-align:right;font-size:15px;font-weight:600;border-bottom:1px solid var(--border);color:var(--text2);white-space:nowrap;background:var(--bg)}
.bal-table td:first-child{text-align:left;color:var(--text);font-weight:700}
td.latest{color:var(--amber) !important;font-weight:800 !important}
.row-section td{background:var(--section-bg);color:var(--text3) !important;font-size:12px !important;font-weight:900;letter-spacing:.12em;text-transform:uppercase;padding:5px 10px 4px;border-top:1px solid var(--border2)}
.row-alt td{background:var(--row-alt) !important}
.row-total td{font-weight:800;font-size:16px !important;color:var(--amber) !important}
.row-ending td{font-weight:900;font-size:16px !important;color:var(--text) !important;background:var(--row-latest) !important}
.row-stu td{font-style:italic;color:var(--amber) !important;font-size:15px !important}
.row-pctile td{font-style:italic;font-size:13px !important;border-bottom:2px solid var(--border2)}
td.pctile-tight{color:var(--red) !important;font-weight:800 !important}
td.pctile-loose{color:var(--green) !important;font-weight:800 !important}
td.pctile-mid{color:var(--text3) !important}
td.prior{color:var(--text3)}
td.up{color:var(--green) !important}
td.dn{color:var(--red) !important}
.stack-wrap{display:flex;flex-direction:column;gap:0}
#err{padding:40px;text-align:center;color:var(--red);font-size:16px}
</style>

<script>
function setGlobalTheme(theme){
  document.body.classList.toggle('dark', theme==='dark');
  document.body.classList.toggle('light', theme==='light');
  document.querySelectorAll('.global-theme-btn').forEach(function(b){
    const active = b.dataset.t === theme;
    b.style.background = active ? '#f5a623' : 'none';
    b.style.color = active ? '#000' : '#6a5a4a';
  });
  const usdaToggle = document.getElementById('theme-toggle');
  if(usdaToggle){
    usdaToggle.querySelectorAll('.tbtn').forEach(function(b){ b.classList.toggle('active', b.dataset.t===theme); });
  }
  if(typeof currentTheme !== 'undefined') currentTheme = theme;
}
document.querySelectorAll('.global-theme-btn').forEach(function(b){
  b.addEventListener('click', function(){ setGlobalTheme(b.dataset.t); });
});
document.querySelectorAll('.page-tab').forEach(function(btn){
  btn.addEventListener('click', function(){
    document.querySelectorAll('.page-tab').forEach(function(b){ b.classList.remove('active'); b.style.color = '#6a5a4a'; });
    btn.classList.add('active'); btn.style.color = '#f5a623';
    document.getElementById('summary-page').style.display = btn.dataset.page === 'summary' ? '' : 'none';
    document.getElementById('usda-page').style.display = btn.dataset.page === 'usda' ? '' : 'none';
    document.getElementById('cftc-page').style.display = btn.dataset.page === 'cftc' ? '' : 'none';
    document.getElementById('seasonals-page').style.display = btn.dataset.page === 'seasonals' ? '' : 'none';
    document.getElementById('exports-page').style.display = btn.dataset.page === 'exports' ? '' : 'none';
    document.getElementById('weather-page').style.display = btn.dataset.page === 'weather' ? '' : 'none';
    if(btn.dataset.page === 'cftc' && typeof fitCftcTable === 'function') fitCftcTable();   // size the columns once the page is visible
  });
});
</script>

<script>
const COMMS = ["Wheat","Corn","Soybeans","Rapeseed/Canola","Oats","Cotton","Coffee","Sugar","Vegoils","Meal"];
const BU_PER_MT = {Wheat:36.7437, Corn:39.3680, Soybeans:36.7437, "Rapeseed/Canola":44.0924, Oats:68.8955};
const ACRES_PER_HA = 2.47105;
const HIST_YEARS = 7;

const EXPORTERS = {
  Wheat: ["United States","European Union","Russia","Canada","Australia","Ukraine","Argentina"],
  Corn: ["United States","Brazil","Argentina","Ukraine","European Union"],
  Soybeans: ["United States","Brazil","Argentina","Paraguay"],
  "Rapeseed/Canola": ["Canada","Australia","European Union","Ukraine"],
  Oats: ["Canada"],
  Cotton: ["United States","Brazil","Australia","India"],
  Coffee: ["Brazil","Vietnam","Colombia","Indonesia","Ethiopia","Honduras"],
  Sugar: ["Brazil","India","Thailand","Australia"]
};
const IMPORTERS = {
  Wheat: ["China","Indonesia","Egypt","Turkey","Algeria","Brazil","Japan","Philippines","Morocco","South Korea","Mexico","Bangladesh"],
  Corn: ["China","Mexico","Japan","South Korea","Vietnam","Egypt","Colombia","Malaysia","Algeria","Indonesia","Iran"],
  Soybeans: ["China","European Union","Mexico","Japan","Egypt","Thailand","Indonesia","Turkey","Bangladesh","Taiwan"],
  "Rapeseed/Canola": ["China","Japan","Bangladesh","Pakistan","Mexico","United States","South Korea"],
  Oats: ["United States"],
  Cotton: ["Bangladesh","Vietnam","China","Pakistan","Indonesia","Turkey"],
  Coffee: ["European Union","United States","Japan"],
  Sugar: ["China","Indonesia","United States","Bangladesh"]
};

let DATA = null;
let currentComm = "Wheat";
let currentUnit = "mt";
let currentTheme = "light";

function fmt(v){
  if(v===null || v===undefined || isNaN(v)) return '—';
  return Math.round(v).toLocaleString();
}
function fmt2(v){
  if(v===null || v===undefined || isNaN(v)) return '—';
  return v.toFixed(1);
}
function fmtStu(v){ return v===null ? '—' : v.toFixed(1)+'%'; }
function ordinal(n){
  const r = Math.round(n);
  const mod100 = r % 100;
  if(mod100>=11 && mod100<=13) return r+'th';
  switch(r % 10){
    case 1: return r+'st';
    case 2: return r+'nd';
    case 3: return r+'rd';
    default: return r+'th';
  }
}
function fmtYoy(v){
  if(v===null) return '—';
  const s = v>=0?'+':'';
  return s+v.toFixed(1)+'%';
}
function yoyPct(cur,prev){
  if(cur===null||prev===null||prev===0) return null;
  return (cur-prev)/Math.abs(prev)*100;
}

// ---- Prior WASDE comparison ----
// psd_data.json carries `_prior`: the previous WASDE's numbers for each commodity's latest market year (built by
// fetch_psd.py from the repo's own history). attachPrior() hangs each one on the matching current-year record as `_p`,
// so every table can read "what the prior estimate was" from the same place it reads the current number.
function attachPrior(data){
  const pr = data && data._prior && data._prior.data;
  if(!pr) return;
  Object.keys(pr).forEach(comm=>{
    const cdata = data[comm]; if(!cdata) return;
    Object.keys(pr[comm]).forEach(country=>{
      const cd = cdata[country]; if(!cd) return;
      Object.keys(pr[comm][country]).forEach(y=>{ if(cd[y]) cd[y]._p = pr[comm][country][y]; });
    });
  });
}
function priorHeader(){
  const d = parseAnyDate(DATA && DATA._prior && DATA._prior.release);
  return d ? 'Prior ' + fmtAsOfDate(d, false) : 'Prior WASDE';
}
// signed change, e.g. +1,250 / -80 / 0 (0 decimals unless told otherwise)
function fmtChg(v, d){
  if(v===null || v===undefined || isNaN(v)) return '—';
  const dec = d || 0;
  const r = Number(v.toFixed(dec));
  if(r === 0) return '0';
  return (r>0?'+':'-') + Math.abs(r).toLocaleString(undefined, {minimumFractionDigits:dec, maximumFractionDigits:dec});
}
function chgClass(v, d){
  if(v===null || v===undefined || isNaN(v)) return '';
  const r = Number(v.toFixed(d||0));
  return r>0 ? 'up' : (r<0 ? 'dn' : '');
}

function getRaw(yearData, key){
  const v = yearData ? yearData[key] : undefined;
  return (v!==undefined && !isNaN(v)) ? v : null;
}
function getTotalRaw(yearData, keys){
  let sum=0, any=false;
  for(const k of keys){ const v=getRaw(yearData,k); if(v!==null){sum+=v;any=true;} }
  return any?sum:null;
}
function getStu(yearData){
  const end=getRaw(yearData,'es'), dom=getRaw(yearData,'dc'), exp=getRaw(yearData,'ex');
  if(end===null||dom===null) return null;
  const denom=dom+(exp||0);
  return denom>0 ? (end/denom)*100 : null;
}
// Commodities with no bushel weight — no MT/BU toggle makes sense for these; Cotton also
// stays in its native bales unit, while Cocoa/Coffee/Sugar stay in MT (just no bushel toggle).
const NO_BUSHEL_COMMS = new Set(['Cotton', 'Cocoa', 'Coffee', 'Sugar']);

function convertVal(raw, unit, comm){
  if(raw===null) return null;
  if(comm==='Cotton') return raw; // cotton stays in its native USDA unit (1000 480-lb bales), no bu/mt conversion applies
  if(NO_BUSHEL_COMMS.has(comm)) return raw; // Cocoa/Coffee/Sugar: no bushel weight exists for these, stay in MT
  if(unit==='bu') return raw * (BU_PER_MT[comm]||36.7437) / 1000;
  return raw;
}
function yieldBuAc(prRaw, ahRaw, comm){
  if(prRaw===null||ahRaw===null||ahRaw===0) return null;
  const mtPerHa = prRaw/ahRaw;
  return mtPerHa * (BU_PER_MT[comm]||36.7437) / ACRES_PER_HA;
}
// Cotton yield, authentic to how cotton traders read it: lbs of lint per harvested acre,
// not bushels — cotton isn't a bushel commodity. 1 bale = 480 lb (USDA's own cotton unit).
function yieldLbAcCotton(prRaw, ahRaw){
  if(prRaw===null||ahRaw===null||ahRaw===0) return null;
  const balesPerHa = prRaw/ahRaw;
  return balesPerHa * 480 / ACRES_PER_HA;
}
// Coffee: production is reported in thousands of 60kg bags (confirmed via sanity-check
// log — 189,667 matches world coffee production only if read as bags, not MT). Same
// treatment as cotton's bales — its own conversion, not the generic MT-based one below.
function yieldLbAcCoffee(prRaw, ahRaw){
  if(prRaw===null||ahRaw===null||ahRaw===0) return null;
  const bagsPerHa = prRaw/ahRaw;
  return bagsPerHa * 132.277 / ACRES_PER_HA; // 1 bag = 60kg = 132.277 lb
}
// Sugar: production IS in plain metric tons (confirmed — its sanity check passed cleanly
// at MT scale), so this generic MT-to-lb conversion applies correctly.
function yieldLbAc(prRaw, ahRaw){
  if(prRaw===null||ahRaw===null||ahRaw===0) return null;
  const mtPerHa = prRaw/ahRaw;
  return mtPerHa * 2204.62 / ACRES_PER_HA;
}
function acresK(ahRaw){ return ahRaw===null ? null : ahRaw*ACRES_PER_HA; }

function sumCountries(countries, countryNames, year){
  const keys=['ah','bs','pr','im','dc','ex','es'];
  const out={}; let any=false;
  const pOut={}; let pAny=false;
  for(const k of keys){
    let s=0, has=false, ps=0, pHas=false, pMissing=false;
    for(const c of countryNames){
      const cd = countries[c];
      const rec = cd ? cd[year] : undefined;
      const v = rec ? rec[k] : undefined;
      if(v!==undefined && !isNaN(v)){
        s+=v; has=true; any=true;
        const pv = rec._p ? rec._p[k] : undefined;
        if(pv!==undefined && !isNaN(pv)){ ps+=pv; pHas=true; } else { pMissing=true; }
      }
    }
    out[k]= has ? s : undefined;
    // the aggregate's prior is only meaningful if EVERY contributing country has a prior (else it would show a fake revision)
    if(has && pHas && !pMissing){ pOut[k]=ps; pAny=true; }
  }
  if(!any) return null;
  if(pAny) out._p = pOut;
  return out;
}

function unitLabel(){
  if(currentComm==='Cotton') return '1000 Bales (480 lb)';
  if(currentComm==='Coffee') return '1000 Bags (60kg)';
  if(NO_BUSHEL_COMMS.has(currentComm)) return '1000 MT'; // Sugar: MT, bu toggle just doesn't apply
  return currentUnit==='bu' ? 'Million Bu' : '1000 MT';
}

function buildBalanceTable(comm, yearDataFn, years, includeYoy, allYearsFull){
  const latestYear = years[years.length-1];
  const prevYear = years.length>1 ? years[years.length-2] : null;

  // Full-history S/U values (not just the displayed years) for percentile ranking.
  const fullYears = allYearsFull || years;
  const stuHistory = fullYears.map(y => getStu(yearDataFn(y))).filter(v => v!==null);
  function stuPctile(y){
    const v = getStu(yearDataFn(y));
    if(v===null || stuHistory.length===0) return null;
    const countLE = stuHistory.filter(x => x<=v).length;
    return (countLE/stuHistory.length)*100;
  }

  const isCotton = comm === 'Cotton';
  const usesLbAcYield = NO_BUSHEL_COMMS.has(comm);
  const ROWS = [
    {type:'row', key:'ah', label:'Area harvested (1000 ac)', area:true},
    {type:'row', key:'yl', label: isCotton ? 'Yield (lb lint/ac)' : (usesLbAcYield ? 'Yield (lb/ac)' : 'Yield (bu/ac)'), yield:true},
    {type:'section', label:'Supply'},
    {type:'row', key:'bs', label:'Beginning stocks'},
    {type:'row', key:'pr', label:'Production'},
    {type:'row', key:'im', label:'Imports'},
    {type:'total', keys:['bs','pr','im'], label:'Total supply'},
    {type:'section', label:'Use'},
    {type:'row', key:'dc', label: isCotton ? 'Mill use' : 'Dom. consumption'},
    {type:'row', key:'ex', label:'Exports'},
    {type:'total', keys:['dc','ex'], label:'Total demand'},
    {type:'section', label:'Balance'},
    {type:'row', key:'es', label:'Ending stocks', cls:'row-ending'},
    {type:'stu', label:'Stocks / Use %', cls:'row-stu'},
    {type:'stu_pctile', label:'S/U Percentile Rank (' + fullYears.length + 'yr hist)', cls:'row-pctile'},
  ];

  // value of a row for one year-record (works for the current numbers and for the prior-WASDE `_p` record alike)
  function valFromYd(row, yd){
    if(row.area) return acresK(getRaw(yd,'ah'));
    if(row.yield){
      if(isCotton) return yieldLbAcCotton(getRaw(yd,'pr'), getRaw(yd,'ah'));
      if(comm==='Coffee') return yieldLbAcCoffee(getRaw(yd,'pr'), getRaw(yd,'ah'));
      if(usesLbAcYield) return yieldLbAc(getRaw(yd,'pr'), getRaw(yd,'ah'));
      return yieldBuAc(getRaw(yd,'pr'), getRaw(yd,'ah'), comm);
    }
    if(row.type==='total') return convertVal(getTotalRaw(yd, row.keys), currentUnit, comm);
    if(row.type==='stu') return getStu(yd);
    return convertVal(getRaw(yd, row.key), currentUnit, comm);
  }
  function displayVal(row, y){
    if(row.type==='stu_pctile') return stuPctile(y);
    return valFromYd(row, yearDataFn(y));
  }
  const latestYd = yearDataFn(latestYear);
  const priorYd = latestYd && latestYd._p ? latestYd._p : null;
  // prior-WASDE cells for one row; a total is only compared when every component exists in BOTH vintages
  function priorCells(row){
    const blank = '<td class="grp-l prior">—</td><td class="prior">—</td>';
    if(row.type==='stu_pctile' || !priorYd) return blank;
    if(row.type==='total' && !row.keys.every(k=>getRaw(priorYd,k)!==null && getRaw(latestYd,k)!==null)) return blank;
    const pv = valFromYd(row, priorYd), cv = valFromYd(row, latestYd);
    if(pv===null) return blank;
    const d = (row.type==='stu' || row.yield) ? 1 : 0;
    const chg = cv!==null ? cv - pv : null;
    const pText = row.type==='stu' ? fmtStu(pv) : (row.yield ? fmt2(pv) : fmt(pv));
    const cText = chg===null ? '—' : fmtChg(chg, d) + (row.type==='stu' && chg!==null && Number(chg.toFixed(1))!==0 ? 'pp' : '');
    return `<td class="grp-l prior">${pText}</td><td class="${chgClass(chg, d)}">${cText}</td>`;
  }

  let html = `<div class="tbl-wrap"><table class="bal-table"><colgroup><col style="width:175px">`;
  for(const y of years) html += '<col>';
  if(includeYoy) html += '<col style="width:75px"><col style="width:100px"><col style="width:80px">';
  html += `</colgroup><thead><tr><th>ITEM</th>`;
  for(const y of years) html += `<th class="${y===latestYear?'latest':''}">${y}</th>`;
  if(includeYoy) html += `<th class="yoy">YoY Δ</th><th class="yoy grp-l">${priorHeader()}</th><th class="yoy">Chg</th>`;
  html += `</tr></thead><tbody>`;

  let alt=false;
  for(const row of ROWS){
    if(row.type==='section'){
      html += `<tr class="row-section"><td colspan="${years.length+1+(includeYoy?3:0)}">${row.label}</td></tr>`;
      alt=false; continue;
    }
    const cls=[row.cls||'', alt?'row-alt':''].filter(Boolean).join(' ');
    html += `<tr class="${cls}"><td>${row.label}</td>`;
    alt=!alt;
    const vals = years.map(y=>displayVal(row,y));
    for(let i=0;i<years.length;i++){
      const v=vals[i], prev=i>0?vals[i-1]:null;
      let tdCls = years[i]===latestYear?'latest':'';
      if(row.type!=='stu' && row.type!=='stu_pctile' && v!==null && prev!==null){
        if(v>prev) tdCls+=' up'; else if(v<prev) tdCls+=' dn';
      }
      if(row.type==='stu_pctile' && v!==null){
        tdCls += v<=25 ? ' pctile-tight' : (v>=75 ? ' pctile-loose' : ' pctile-mid');
      }
      const text = row.type==='stu' ? fmtStu(v) : (row.type==='stu_pctile' ? (v===null?'—':ordinal(v)) : (row.yield ? fmt2(v) : fmt(v)));
      html += `<td class="${tdCls.trim()}">${text}</td>`;
    }
    if(includeYoy){
      if(row.type==='stu_pctile'){
        html += `<td class="latest">—</td>`;
      } else {
        const cur = displayVal(row, latestYear);
        const prev = prevYear ? displayVal(row, prevYear) : null;
        const yoy = row.type==='stu' ? (cur!==null&&prev!==null?cur-prev:null) : yoyPct(cur,prev);
        let cls = 'latest';
        if(yoy!==null){ cls += yoy>0?' up':(yoy<0?' dn':''); }
        const text = row.type==='stu' ? (yoy===null?'—':(yoy>=0?'+':'')+yoy.toFixed(1)+'pp') : fmtYoy(yoy);
        html += `<td class="${cls}">${text}</td>`;
      }
      html += priorCells(row);
    }
    html += '</tr>';
  }
  html += '</tbody></table></div>';
  return html;
}

function panelWrap(title, sub, innerHtml){
  return `<div class="panel"><div class="panel-hdr"><span class="panel-title">${title}</span><span class="panel-sub">${sub}</span></div>${innerHtml}</div>`;
}

// Looks up CROP_CALENDAR (defined later in the file, safe since this only runs after full page load)
// for a country's harvest months for a given USDA commodity, so panel headers can show a quick
// "when does this country harvest" hint without needing to check the separate calendar table.
function getHarvestMonthsLabel(comm, country){
  if(typeof CROP_CALENDAR === 'undefined') return '';
  const sectionMap = {'Wheat':'Wheat','Corn':'Corn','Soybeans':'Soybeans','Rapeseed/Canola':'Canola','Cotton':'Cotton','Cocoa':'Cocoa','Coffee':'Coffee','Sugar':'Sugar'};
  const section = sectionMap[comm];
  if(!section) return '';
  const matches = CROP_CALENDAR.filter(r=>r.section===section && (r.origin===country || r.origin.indexOf(country+' (')===0));
  if(!matches.length) return '';
  const months = new Set();
  matches.forEach(m=>m.harvest.forEach(mo=>months.add(mo)));
  if(!months.size) return '';
  const MONNAMES=['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return [...months].sort((a,b)=>a-b).map(m=>MONNAMES[m]).join('/');
}
function panelTitleWithHarvest(comm, country){
  const months = getHarvestMonthsLabel(comm, country);
  const base = country.toUpperCase();
  return months ? `${base} <span style="color:var(--text3);font-weight:600;font-size:11px;letter-spacing:.02em;text-transform:none">(harvest: ${months})</span>` : base;
}

// Multi-year, country-by-year breakout table for a single metric (e.g. Acres across N years), plus YoY change.
function buildMetricByCountryTable(countryList, countries, years, metric){
  const latestYear = years[years.length-1];
  const prevYear = years.length>1 ? years[years.length-2] : null;
  let html = `<div class="tbl-wrap"><table class="bal-table"><thead><tr><th>Country</th>`;
  years.forEach(y=>{ html += `<th class="${y===latestYear?'latest':''}">${y}</th>`; });
  html += `<th class="yoy">YoY Δ</th><th class="yoy grp-l">${priorHeader()}</th><th class="yoy">Chg</th>`;
  html += `</tr></thead><tbody>`;

  let alt=false;
  const totals = {};
  years.forEach(y=>totals[y]={sum:0,has:false});
  const pTot = {sum:0, has:false, missing:false};   // prior total only if every country has a prior value

  function metricVal(cd, y){
    if(metric==='ah') return acresK(getRaw(cd[y], 'ah'));
    return convertVal(getRaw(cd[y], metric), currentUnit, currentComm);
  }

  countryList.forEach(c=>{
    const cd = countries[c] || {};
    html += `<tr class="${alt?'row-alt':''}"><td>${c}</td>`;
    alt=!alt;
    let prevVal = null;
    years.forEach(y=>{
      const v = metricVal(cd, y);
      if(v!==null){ totals[y].sum += v; totals[y].has = true; }
      let cls = y===latestYear ? 'latest' : '';
      if(v!==null && prevVal!==null){ cls += v>prevVal?' up':(v<prevVal?' dn':''); }
      html += `<td class="${cls.trim()}">${fmt(v)}</td>`;
      prevVal = v;
    });
    const curV = metricVal(cd, latestYear);
    const prevV = prevYear ? metricVal(cd, prevYear) : null;
    const yoy = yoyPct(curV, prevV);
    let yoyCls = 'latest';
    if(yoy!==null){ yoyCls += yoy>0?' up':(yoy<0?' dn':''); }
    html += `<td class="${yoyCls}">${fmtYoy(yoy)}</td>`;
    // prior WASDE: the latest year's prior value for this country + the revision
    const pRec = cd[latestYear] ? cd[latestYear]._p : undefined;
    const pV = pRec ? (metric==='ah' ? acresK(getRaw(pRec,'ah')) : convertVal(getRaw(pRec, metric), currentUnit, currentComm)) : null;
    if(curV!==null){ if(pV!==null){ pTot.sum += pV; pTot.has = true; } else { pTot.missing = true; } }
    const rChg = (curV!==null && pV!==null) ? curV - pV : null;
    html += `<td class="grp-l prior">${fmt(pV)}</td><td class="${chgClass(rChg,0)}">${fmtChg(rChg,0)}</td>`;
    html += `</tr>`;
  });

  html += `<tr class="row-total"><td>Total</td>`;
  years.forEach(y=>{
    const t = totals[y];
    const v = t.has ? t.sum : null;
    html += `<td>${fmt(v)}</td>`;
  });
  const totCur = totals[latestYear].has ? totals[latestYear].sum : null;
  const totPrev = prevYear && totals[prevYear].has ? totals[prevYear].sum : null;
  const totYoy = yoyPct(totCur, totPrev);
  html += `<td>${fmtYoy(totYoy)}</td>`;
  const pTotV = (pTot.has && !pTot.missing) ? pTot.sum : null;
  const tChg = (pTotV!==null && totCur!==null) ? totCur - pTotV : null;
  html += `<td class="grp-l prior">${fmt(pTotV)}</td><td class="${chgClass(tChg,0)}">${fmtChg(tChg,0)}</td>`;
  html += `</tr></tbody></table></div>`;
  return html;
}

function render(){
  const root = document.getElementById('root');
  root.innerHTML = '';
  const comm = currentComm;
  updateUsdaMeta();   // the "data as of" line depends on the selected commodity

  const convLabel = document.getElementById('conv-label');
  const unitToggleEl = document.getElementById('unit-toggle');

  // Vegoils: a different shape entirely — combines 4 separate oil commodities
  // rather than showing one commodity's own data, so it's handled as its own
  // render path rather than the shared World/Exporters/Importers/breakout template.
  if(comm === 'Vegoils'){
    if(unitToggleEl) unitToggleEl.style.display = 'none';
    convLabel.textContent = '1000 MT — palm + soy + rapeseed + sunflower oil';
    renderVegoilsInto(root);
    return;
  }
  if(comm === 'Meal'){
    if(unitToggleEl) unitToggleEl.style.display = 'none';
    convLabel.textContent = '1000 MT — soy + rapeseed + sunflower meal';
    renderMealInto(root);
    return;
  }
  if(unitToggleEl) unitToggleEl.style.display = NO_BUSHEL_COMMS.has(comm) ? 'none' : '';

  const countries = DATA[comm];

  if(comm === 'Cotton'){
    convLabel.textContent = 'Native units: 1000 bales (480 lb), acres, lb lint/acre';
  } else if(comm === 'Coffee'){
    convLabel.textContent = 'Native units: 1000 bags (60 kg), acres, lb/acre';
  } else if(NO_BUSHEL_COMMS.has(comm)){
    convLabel.textContent = '1000 MT, acres, lb/acre';
  } else {
    const buPerMt = BU_PER_MT[comm] || 36.7437;
    convLabel.textContent = `1 MT = ${buPerMt.toFixed(2)} bu (${comm==='Rapeseed/Canola'?'Canola':comm})`;
  }

  if(!countries){ root.innerHTML = '<div id="err">No data for '+comm+'</div>'; return; }

  const allYears = new Set();
  Object.values(countries).forEach(yrs=>Object.keys(yrs).forEach(y=>allYears.add(y)));
  const yearsAll = [...allYears].sort();
  const years10 = yearsAll.slice(-HIST_YEARS);
  if(!years10.length){ root.innerHTML = '<div id="err">No years of data available</div>'; return; }

  const expList = (EXPORTERS[comm]||[]).filter(c=>countries[c]);
  const impList = (IMPORTERS[comm]||[]).filter(c=>countries[c]);

  // Oats: simplified view — just the two country balance sheets, nothing else.
  if(comm === 'Oats'){
    root.insertAdjacentHTML('beforeend', `<div class="sec-hdr">Oats — Canada / United States Balance Sheets</div>`);
    const stackOats = document.createElement('div');
    stackOats.className = 'stack-wrap';
    ['Canada','United States'].filter(c=>countries[c]).forEach(c=>{
      stackOats.insertAdjacentHTML('beforeend', panelWrap(c.toUpperCase(), unitLabel(),
        buildBalanceTable(comm, y=>(countries[c]||{})[y], years10, true, yearsAll)));
    });
    root.appendChild(stackOats);
    return;
  }

  root.insertAdjacentHTML('beforeend', `<div class="sec-hdr">World Balance Sheet — ${comm}</div>`);
  root.insertAdjacentHTML('beforeend', panelWrap('WORLD', unitLabel(),
    buildBalanceTable(comm, y=>(countries['World']||{})[y], years10, true, yearsAll)));

  root.insertAdjacentHTML('beforeend', `<div class="sec-hdr">Major Exporters — Aggregate Balance Sheet</div>`);
  root.insertAdjacentHTML('beforeend', panelWrap('MAJOR EXPORTERS', expList.join(', '),
    buildBalanceTable(comm, y=>sumCountries(countries, expList, y), years10, true, yearsAll)));

  root.insertAdjacentHTML('beforeend', `<div class="sec-hdr">Major Importers — Aggregate Balance Sheet</div>`);
  root.insertAdjacentHTML('beforeend', panelWrap('MAJOR IMPORTERS', impList.join(', '),
    buildBalanceTable(comm, y=>sumCountries(countries, impList, y), years10, true, yearsAll)));

  root.insertAdjacentHTML('beforeend', `<div class="sec-hdr">Major Exporters — Individual Balance Sheets</div>`);
  const stack = document.createElement('div');
  stack.className = 'stack-wrap';
  expList.forEach(c=>{
    stack.insertAdjacentHTML('beforeend', panelWrap(panelTitleWithHarvest(comm, c), unitLabel(),
      buildBalanceTable(comm, y=>(countries[c]||{})[y], years10, true, yearsAll)));
  });
  root.appendChild(stack);

  // Exporters: Acres / Production / Exports, each as its own 10-year country x year table
  root.insertAdjacentHTML('beforeend', `<div class="sec-hdr">Major Exporters — 10-Year Country Breakout</div>`);
  root.insertAdjacentHTML('beforeend', panelWrap('ACRES', 'Exporters — 1000 acres',
    buildMetricByCountryTable(expList, countries, years10, 'ah')));
  root.insertAdjacentHTML('beforeend', panelWrap('PRODUCTION', 'Exporters — ' + unitLabel(),
    buildMetricByCountryTable(expList, countries, years10, 'pr')));
  root.insertAdjacentHTML('beforeend', panelWrap('EXPORTS', 'Exporters — ' + unitLabel(),
    buildMetricByCountryTable(expList, countries, years10, 'ex')));

  // Importers: Production / Imports / Ending Stocks, same layout
  root.insertAdjacentHTML('beforeend', `<div class="sec-hdr">Major Importers — 10-Year Country Breakout</div>`);
  root.insertAdjacentHTML('beforeend', panelWrap('PRODUCTION', 'Importers — ' + unitLabel(),
    buildMetricByCountryTable(impList, countries, years10, 'pr')));
  root.insertAdjacentHTML('beforeend', panelWrap('IMPORTS', 'Importers — ' + unitLabel(),
    buildMetricByCountryTable(impList, countries, years10, 'im')));
  root.insertAdjacentHTML('beforeend', panelWrap('ENDING STOCKS', 'Importers — ' + unitLabel(),
    buildMetricByCountryTable(impList, countries, years10, 'es')));
}

function initToggles(){
  const ct = document.getElementById('comm-toggle');
  ct.innerHTML = COMMS.map(c=>`<button class="tbtn${c===currentComm?' active':''}" data-c="${c}">${c==='Rapeseed/Canola'?'Canola':c}</button>`).join('');
  ct.querySelectorAll('.tbtn').forEach(b=>b.addEventListener('click',()=>{
    currentComm = b.dataset.c;
    ct.querySelectorAll('.tbtn').forEach(x=>x.classList.toggle('active', x===b));
    render();
  }));

  const ut = document.getElementById('unit-toggle');
  ut.querySelectorAll('.tbtn').forEach(b=>{
    b.classList.toggle('active', b.dataset.u===currentUnit);
    b.addEventListener('click', ()=>{
      currentUnit = b.dataset.u;
      ut.querySelectorAll('.tbtn').forEach(x=>x.classList.toggle('active', x===b));
      render();
    });
  });
}

// ---- "Data as of": when the underlying numbers are from (the header's "Last updated" is only when the pipeline ran) ----
function parseAnyDate(s){
  if(!s) return null;
  s = String(s).trim();
  let m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s);                 // 2026-10-13
  if(m) return new Date(Date.UTC(+m[1], +m[2]-1, +m[3]));
  m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(s);               // 10/08/2026
  if(m) return new Date(Date.UTC(+m[3], +m[1]-1, +m[2]));
  return null;
}
function fmtAsOfDate(d, withWeekday){
  const o = {month:'short', day:'numeric', timeZone:'UTC'};
  if(withWeekday) o.weekday = 'short';
  return d.toLocaleDateString('en-US', o);
}
// CFTC: each history row's date is the Tuesday the positions are "as of" (the report itself comes out that Friday)
function latestCftcDate(){
  if(!CFTC_DATA || !CFTC_DATA.codes) return null;
  let best = null;
  Object.values(CFTC_DATA.codes).forEach(c=>{
    const h = c.history;
    const d = (h && h.length) ? parseAnyDate(h[h.length-1].date) : null;
    if(d && (!best || d > best)) best = d;
  });
  return best;
}
// Export Sales: the week-ending date of the latest weekly report
function latestExportsDate(){
  if(!EXPORTS_DATA || !EXPORTS_DATA.commodities) return null;
  let best = null;
  Object.values(EXPORTS_DATA.commodities).forEach(c=>{
    const d = parseAnyDate(c && c.total && c.total.period_ending);
    if(d && (!best || d > best)) best = d;
  });
  return best;
}
// USDA: the WASDE release the pulled PSD numbers reflect (worked out by fetch_psd.py from USDA's release schedule).
// Coffee and Sugar are on USDA's semi-annual reports instead of the monthly WASDE.
function usdaAsOfText(comm){
  if(comm === 'Coffee' || comm === 'Sugar') return 'USDA estimates: semi-annual report';
  const d = parseAnyDate(DATA && DATA._meta && DATA._meta.wasde_release);
  const pd = parseAnyDate(DATA && DATA._prior && DATA._prior.release);
  return d ? 'USDA estimates: ' + fmtAsOfDate(d, false) + ' WASDE' + (pd ? ' (prior: ' + fmtAsOfDate(pd, false) + ')' : '') : '';
}
// Header block: line 1 = when the pipeline last ran, line 2 = what date the data itself is from
function setMetaLines(id, runStamp, asOfText){
  const el = document.getElementById(id);
  if(!el) return;
  const esc = t => String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  el.style.textAlign = 'right';
  el.style.lineHeight = '1.5';
  el.innerHTML = 'Last updated: ' + esc(runStamp || 'unknown') +
    (asOfText ? '<br><span style="color:var(--text2)">' + esc(asOfText) + '</span>' : '');
}
function updateUsdaMeta(){ setMetaLines('meta', DATA && DATA._meta && DATA._meta.fetched_at, usdaAsOfText(currentComm)); }

fetch('data/psd_data.json?_=' + Date.now())
  .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
  .then(data=>{
    DATA = data;
    attachPrior(DATA);
    updateUsdaMeta();
    initToggles();
    render();
    usdaReady = true;
    if(typeof checkSummaryReady === 'function') checkSummaryReady();
  })
  .catch(e=>{
    document.getElementById('root').innerHTML = `<div id="err">Error loading data: ${e.message}</div>`;
  });
</script>

</style>
<script>
const CFTC_GROUPS = [
  {label:"Grains", codes:[
    {code:"002602", label:"Corn"},
    {code:"001602", label:"Wheat (Chicago SRW)"},
    {code:"001612", label:"Wheat (KC HRW)"},

  ]},

  // Financial futures come from CFTC's separate TFF report, which has no "Managed Money": Leveraged Funds is the closest equivalent.
  {label:"Currencies", note:"Leveraged Funds", codes:[
    {code:"098662", label:"US Dollar Index"},
    {code:"099741", label:"Euro"},
    {code:"097741", label:"Japanese Yen"},
    {code:"096742", label:"British Pound"},
    {code:"090741", label:"Canadian Dollar"},
    {code:"232741", label:"Australian Dollar"},
    {code:"092741", label:"Swiss Franc"},
  ]},
  {label:"Equities", note:"Leveraged Funds", codes:[
    {code:"13874A", label:"S&P 500 (E-mini)"},
  ]},
  {label:"Treasuries", note:"Leveraged Funds", codes:[
    {code:"042601", label:"2-Yr T-Note"},
    {code:"044601", label:"5-Yr T-Note"},
    {code:"043602", label:"10-Yr T-Note"},
    {code:"043607", label:"Ultra 10-Yr T-Note"},
    {code:"020601", label:"T-Bond (30-Yr)"},
    {code:"020604", label:"Ultra T-Bond"},
  ]},
];

let CFTC_DATA = null;
let cftcLoaded = false;
let usdaReady = false;
let cftcReady = false;
let exportsReady = false;
let WEATHER_DATA = null;
let weatherState = 'loading';   // 'loading' | 'ready' | 'failed' - only the Weather page cares
function checkSummaryReady(){
  if(usdaReady && cftcReady && exportsReady && typeof renderSummary === 'function') renderSummary();
}

fetch('data/weather_data.json?_=' + Date.now())
  .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
  .then(data=>{
    WEATHER_DATA = data;
    weatherState = 'ready';
    if(typeof renderWeatherPage === 'function') renderWeatherPage();
  })
  .catch(e=>{
    weatherState = 'failed';
    if(typeof renderWeatherPage === 'function') renderWeatherPage();
  });

function cftcFmt(v){ return (v===null||v===undefined||isNaN(v)) ? '—' : Math.round(v).toLocaleString(); }
function cftcPct(v){ return (v===null||v===undefined||isNaN(v)) ? '—' : v.toFixed(1)+'%'; }
function cftcSignedPct(v, dec){
  if(v===null||v===undefined||isNaN(v)) return '—';
  const s = v>=0?'+':'';
  return s+v.toFixed(dec===undefined?1:dec)+'%';
}
function cftcSignedNum(v){
  if(v===null||v===undefined||isNaN(v)) return '—';
  const s = v>=0?'+':'';
  return s+Math.round(v).toLocaleString();
}
function cftcOrdinal(n){
  const r = Math.round(n), mod100 = r%100;
  if(mod100>=11 && mod100<=13) return r+'th';
  switch(r%10){case 1:return r+'st';case 2:return r+'nd';case 3:return r+'rd';default:return r+'th';}
}

function computeRow(hist, i){
  const h = hist[i];
  const oi = h.oi, mmL = h.mm_long, mmS = h.mm_short;
  const net = (mmL!==null && mmS!==null) ? mmL-mmS : null;
  const netPctOi = (net!==null && oi) ? net/oi*100 : null;
  const grossLPctOi = (mmL!==null && oi) ? mmL/oi*100 : null;
  const grossSPctOi = (mmS!==null && oi) ? mmS/oi*100 : null;
  let weeklyChange = null;
  if(i>0){
    const prev = hist[i-1];
    if(prev.mm_long!==null && prev.mm_short!==null && mmL!==null && mmS!==null){
      weeklyChange = net - (prev.mm_long - prev.mm_short);
    }
  }
  // Change in gross longs / shorts vs the prior weekly report (did funds add to, or cut, each side)
  let grossLChg = null, grossSChg = null;
  if(i>0){
    const prev = hist[i-1];
    if(prev.mm_long!==null && mmL!==null) grossLChg = mmL - prev.mm_long;
    if(prev.mm_short!==null && mmS!==null) grossSChg = mmS - prev.mm_short;
  }
  return {oi, oiChg:h.oi_chg, mmL, mmS, net, netPctOi, grossLPctOi, grossSPctOi, weeklyChange, grossLChg, grossSChg};
}

function computeLatestMetrics(entry, hist){
  if(!hist || !hist.length) return null;
  const rows = hist.map((h,i)=>computeRow(hist,i));
  const latest = rows[rows.length-1];
  const netHistory = rows.map(r=>r.netPctOi).filter(v=>v!==null);
  const glHistory = rows.map(r=>r.grossLPctOi).filter(v=>v!==null);
  const gsHistory = rows.map(r=>r.grossSPctOi).filter(v=>v!==null);

  function pctileOf(v, arr){
    if(v===null || !arr.length) return null;
    return arr.filter(x=>x<=v).length/arr.length*100;
  }
  // Largest positions seen over the whole history window: in contracts, and as a share of open interest (each is
  // its own maximum, so they can fall on different dates), with the report date they were set.
  const ext = {maxNetLong:null, maxNetShort:null, maxGrossLong:null, maxGrossShort:null,
               maxNetLongPct:null, maxNetShortPct:null, maxGrossLongPct:null, maxGrossShortPct:null};
  const hi = (cur, v, date)=> (cur===null || v>cur.v) ? {v, date} : cur;
  const lo = (cur, v, date)=> (cur===null || v<cur.v) ? {v, date} : cur;
  rows.forEach((r,i)=>{
    const date = hist[i].date;
    if(r.net!==null){ ext.maxNetLong = hi(ext.maxNetLong, r.net, date); ext.maxNetShort = lo(ext.maxNetShort, r.net, date); }
    if(r.mmL!==null) ext.maxGrossLong = hi(ext.maxGrossLong, r.mmL, date);
    if(r.mmS!==null) ext.maxGrossShort = hi(ext.maxGrossShort, r.mmS, date);
    if(r.netPctOi!==null){ ext.maxNetLongPct = hi(ext.maxNetLongPct, r.netPctOi, date); ext.maxNetShortPct = lo(ext.maxNetShortPct, r.netPctOi, date); }
    if(r.grossLPctOi!==null) ext.maxGrossLongPct = hi(ext.maxGrossLongPct, r.grossLPctOi, date);
    if(r.grossSPctOi!==null) ext.maxGrossShortPct = hi(ext.maxGrossShortPct, r.grossSPctOi, date);
  });
  return {
    ...latest,
    netPctile: pctileOf(latest.netPctOi, netHistory),
    glPctile: pctileOf(latest.grossLPctOi, glHistory),
    gsPctile: pctileOf(latest.grossSPctOi, gsHistory),
    ...ext,
  };
}

// What a week's change in the net position (contracts) means given the side the funds are on
function posActionText(net, chg){
  if(net===null || chg===null || chg===undefined) return '';
  if(chg===0) return 'unchanged';
  if(net>=0) return chg>0 ? 'adding to longs' : 'unwinding longs';
  return chg<0 ? 'adding to shorts' : 'covering shorts';
}

function extremeClass(p){
  if(p===null || p===undefined) return '';
  if(p>=90) return 'cftc-extreme-hi';
  if(p<=10) return 'cftc-extreme-lo';
  return '';
}
// Net % of OI: high percentile = crowded long (flag red), low percentile = crowded short (flag green)
function netExtremeClass(p){
  if(p===null || p===undefined) return '';
  if(p>=90) return 'cftc-extreme-lo';   // red
  if(p<=10) return 'cftc-extreme-hi';   // green
  return '';
}
// Gross long/short % of OI: only flag unusually LARGE positions, in yellow. Small positions aren't flagged.
function grossExtremeClass(p){
  if(p===null || p===undefined) return '';
  if(p>=90) return 'cftc-extreme-yellow';
  return '';
}

// Chart state: which contract is selected (click a row), contracts vs % of OI, and how many years to show
let cftcSelected = null;
let cftcChartMode = 'contracts';   // 'contracts' | 'pct'
let cftcChartYears = 2;

const CFTC_COL_GROUPS = [
  {label:'Position', cols:['Net Position','Wkly Chg']},
  {label:'Net Exposure', cols:['Net % OI','Pctile']},
  {label:'Gross Positions', cols:['Gross Long','Gross Short']},
  {label:'Open Interest', cols:['OI','OI Chg']},
  // Reference only (not part of the live positioning): the largest positions seen over the history window, in contracts.
  {label:'Historical Max', ref:true, cols:['Net Long','Net Short','Gross Long','Gross Short']},
];

// Gross long/short cell: the figure, with the week's change small beside it.
// Colour = sign of the change, same for longs and shorts: added = green, cut = red.
function cftcGrossCell(val, chg, isShort){
  let chgHtml = '<span class="gc"></span>';
  if(chg!==null && chg!==undefined && !isNaN(chg)){
    const r = Math.round(chg);
    const cls = r===0 ? '' : (r>0 ? 'cftc-up' : 'cftc-dn');
    chgHtml = `<span class="gc ${cls}" title="${isShort?'Shorts':'Longs'} ${r>0?'added':(r<0?'cut':'unchanged')} vs prior week">${r===0?'0':cftcSignedNum(r)}</span>`;
  }
  return `<span class="gf">${cftcFmt(val)}</span>${chgHtml}`;
}

function buildCftcRow(entry, hist){
  const m = computeLatestMetrics(entry, hist);
  let html = m
    ? `<tr class="cftc-click${entry.code===cftcSelected?' cftc-sel':''}" data-code="${entry.code}" title="Click to chart"><td>${entry.label}</td>`
    : `<tr><td>${entry.label}</td>`;
  if(!m){
    html += `<td class="grp-l" colspan="12" style="text-align:left;color:var(--text3)">No data (code ${entry.code})</td>`;
  } else {
    html += `<td class="grp-l ${m.net>=0?'cftc-up':'cftc-dn'}">${cftcFmt(m.net)}</td>`;
    html += `<td class="${m.weeklyChange>=0?'cftc-up':'cftc-dn'}">${cftcSignedNum(m.weeklyChange)}</td>`;
    html += `<td class="grp-l ${m.netPctOi>=0?'cftc-up':'cftc-dn'}">${cftcPct(m.netPctOi)}</td>`;
    html += `<td class="${netExtremeClass(m.netPctile)}">${m.netPctile===null?'—':cftcOrdinal(m.netPctile)}</td>`;
    // gross long / short: yellow when unusually large vs the lookback; hover for the position as a share of open interest
    const yrs = CFTC_DATA._meta?.years_history;
    const grossTip = (what, v, pctOi, pctile)=> `${what}: ${cftcFmt(v)} contracts = ${cftcPct(pctOi)} of open interest` + (pctile===null||pctile===undefined ? '' : ` · ${cftcOrdinal(pctile)} percentile${yrs ? ' of the '+yrs+'-yr window' : ''}`);
    html += `<td class="grp-l ${grossExtremeClass(m.glPctile)}" title="${grossTip('Gross long', m.mmL, m.grossLPctOi, m.glPctile)}">${cftcGrossCell(m.mmL, m.grossLChg, false)}</td>`;
    html += `<td class="${grossExtremeClass(m.gsPctile)}" title="${grossTip('Gross short', m.mmS, m.grossSPctOi, m.gsPctile)}">${cftcGrossCell(m.mmS, m.grossSChg, true)}</td>`;
    html += `<td class="grp-l">${cftcFmt(m.oi)}</td>`;
    html += `<td class="${m.oiChg>=0?'cftc-up':'cftc-dn'}">${cftcSignedNum(m.oiChg)}</td>`;
    // historical extremes (reference columns, styled differently so they don't read as part of the live table)
    // each shows the largest position in contracts; the net maxes also show the largest share of open interest in small
    // type (the gross maxes keep theirs in the hover text only)
    [['maxNetLong','maxNetLongPct','Largest net long', true],['maxNetShort','maxNetShortPct','Largest net short', true],
     ['maxGrossLong','maxGrossLongPct','Largest gross long', false],['maxGrossShort','maxGrossShortPct','Largest gross short', false]].forEach(([k, kp, what, showPct], i)=>{
      const e = m[k], ep = m[kp];
      const tip = e ? `${what}: ${cftcFmt(e.v)} contracts, set ${e.date}` + (ep ? ` · largest % of OI: ${cftcPct(ep.v)}, set ${ep.date}` : '') : '';
      html += `<td class="cftc-ref${i===0?' grp-l':''}"${tip?` title="${tip}"`:''}><span class="rf">${e ? cftcFmt(e.v) : '—'}</span>${showPct ? `<span class="rp">${ep ? cftcPct(ep.v) : ''}</span>` : ''}</td>`;
    });
  }
  html += `</tr>`;
  return html;
}

// How spare width is shared out (each column is already sized to fit its content): Product, Net Pos, Wkly Chg, Net%OI,
// Pctile, Gross Long, Gross Short, OI, OI Chg, then the 4 Historical Max columns - which get very little, so that
// reference section stays compact instead of stretching.
const CFTC_COL_WIDTHS = [12, 9, 8, 8, 7, 14, 14, 9, 8, 2.75, 2.75, 2.75, 2.75];
function buildCftcMasterTable(){
  const yrs = CFTC_DATA._meta?.years_history;
  let html = `<div class="tbl-wrap"><div class="cftc-scale"><table class="cftc-table"><colgroup>${CFTC_COL_WIDTHS.map(w=>`<col style="width:${w}%">`).join('')}</colgroup><thead>`;
  html += `<tr><th rowspan="2">Product</th>`;
  CFTC_COL_GROUPS.forEach(g=>{
    const label = g.ref ? `${g.label}<span class="cftc-ref-sub">${yrs ? yrs+'yr · ' : ''}contracts</span>` : g.label;
    html += `<th colspan="${g.cols.length}" class="grp-l${g.ref?' cftc-ref-h':''}" style="text-align:center;${g.ref?'':'color:var(--amber);'}font-size:13px;letter-spacing:.08em">${label}</th>`;
  });
  html += `</tr><tr>`;
  CFTC_COL_GROUPS.forEach(g=>{
    g.cols.forEach((c,i)=>{ html += `<th class="${i===0?'grp-l ':''}${g.ref?'cftc-ref-h':''}">${c}</th>`; });
  });
  html += `</tr></thead><tbody>`;

  CFTC_GROUPS.forEach(group=>{
    html += `<tr class="cftc-row-section"><td colspan="13">${group.label}${group.note ? `<span class="cftc-note">${group.note}</span>` : ''}</td></tr>`;
    group.codes.forEach(entry=>{
      const hist = (CFTC_DATA.codes && CFTC_DATA.codes[entry.code]) ? CFTC_DATA.codes[entry.code].history : null;
      html += buildCftcRow(entry, hist);
    });
  });
  html += `</tbody></table></div></div>`;
  return html;
}

// ---------------- CFTC CHART ----------------
// Click a row in the table and the chart below shows that contract: net position as a line, gross long as a faded green
// histogram, gross short as a faded red histogram hanging below zero, and the historical maxima as faint dashed lines.
function cftcProductList(){
  const out = [];
  CFTC_GROUPS.forEach(g=>g.codes.forEach(e=>{
    const h = CFTC_DATA.codes && CFTC_DATA.codes[e.code] ? CFTC_DATA.codes[e.code].history : null;
    if(h && h.length) out.push(e);
  }));
  return out;
}
function cftcSelect(code, scroll){
  cftcSelected = code;
  document.querySelectorAll('#cftc-root tr.cftc-click').forEach(tr=>tr.classList.toggle('cftc-sel', tr.dataset.code === code));
  renderCftcChart();
  if(scroll){ const box = document.getElementById('cftc-chart'); if(box) box.scrollIntoView({behavior:'smooth', block:'nearest'}); }
}
function cftcNiceTicks(lo, hi, n){
  const span = (hi - lo) || 1, raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), norm = raw / mag;
  const step = (norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10) * mag;
  const ticks = [];
  for(let v = Math.ceil(lo / step) * step; v <= hi + step * 1e-9; v += step) ticks.push(Math.abs(v) < step * 1e-9 ? 0 : v);
  return ticks;
}
function cftcAxisFmt(v, pct){
  if(pct) return v.toFixed(0) + '%';
  const a = Math.abs(v);
  return a >= 1e6 ? (v / 1e6).toFixed(1) + 'M' : a >= 1e3 ? Math.round(v / 1e3) + 'k' : String(Math.round(v));
}

function renderCftcChart(){
  const box = document.getElementById('cftc-chart');
  if(!box || !CFTC_DATA || !CFTC_DATA.codes) return;
  const rec = CFTC_DATA.codes[cftcSelected];
  if(!rec || !rec.history || !rec.history.length){ box.innerHTML = ''; return; }
  const pct = cftcChartMode === 'pct';
  const list = cftcProductList();
  const entry = list.find(e=>e.code === cftcSelected) || {label: rec.label || cftcSelected};
  const m = computeLatestMetrics(entry, rec.history);

  // weekly series, in contracts and as % of open interest
  const full = rec.history.map(h=>{
    const net = (h.mm_long !== null && h.mm_short !== null) ? h.mm_long - h.mm_short : null, oi = h.oi;
    return {date:h.date, net, long:h.mm_long, short:h.mm_short,
      netPct:   (net !== null && oi) ? net / oi * 100 : null,
      longPct:  (h.mm_long !== null && oi) ? h.mm_long / oi * 100 : null,
      shortPct: (h.mm_short !== null && oi) ? h.mm_short / oi * 100 : null};
  });
  full.forEach((p, i)=>{                      // week-over-week changes, in contracts (null if either week is missing)
    const q = i > 0 ? full[i - 1] : null, d = (a, b)=> (a !== null && b !== null && q) ? a - b : null;
    p.chg = q ? d(p.net, q.net) : null; p.dLong = q ? d(p.long, q.long) : null; p.dShort = q ? d(p.short, q.short) : null;
  });
  const cut = new Date(full[full.length-1].date + 'T00:00:00Z'); cut.setUTCFullYear(cut.getUTCFullYear() - cftcChartYears);
  const cutIso = cut.toISOString().slice(0, 10);
  const kN = pct ? 'netPct' : 'net', kL = pct ? 'longPct' : 'long', kS = pct ? 'shortPct' : 'short';
  const pts = full.filter(p => p.date >= cutIso && p[kN] !== null && p[kL] !== null && p[kS] !== null);

  const idx = list.findIndex(e=>e.code === cftcSelected);
  const toggle = (cls, items, active) => `<div class="toggle">${items.map(([v, t])=>`<button class="tbtn ${cls}${String(v)===String(active)?' active':''}" data-v="${v}">${t}</button>`).join('')}</div>`;
  let html = `<div class="cftc-chart-hdr">
    <div class="cftc-chart-title"><button class="tbtn cftc-step" data-d="-1" title="Previous product">◀</button>
      <span>${entry.label}<small>${rec.category || 'Managed Money'}</small></span>
      <button class="tbtn cftc-step" data-d="1" title="Next product">▶</button></div>
    ${toggle('cftc-mode', [['contracts','Contracts'], ['pct','% OI'], ['chg','Net chg']], cftcChartMode)}
    ${toggle('cftc-years', [[1,'1Y'], [2,'2Y'], [5,'5Y'], [10,'10Y']], cftcChartYears)}
    <div class="cftc-legend">${cftcChartMode === 'chg' ? '<span><i class="lg-bar lg-g"></i>Net buying (net position up on the week)</span><span><i class="lg-bar lg-r"></i>Net selling (net position down)</span>' : `<span><i class="lg-line"></i>Net position</span><span><i class="lg-bar lg-g"></i>Gross long</span><span><i class="lg-bar lg-r"></i>Gross short (shown negative)</span><span><i class="lg-dash"></i>Historical max</span>`}</div>
  </div>`;
  if(cftcChartMode === 'chg'){ renderCftcChangeChart(box, html, full, cutIso, idx, list); return; }
  if(pts.length < 2){
    box.innerHTML = html + `<div style="padding:30px 0;color:var(--text3)">Not enough history to chart.</div>`;
    wireCftcChartControls(box, idx, list);
    return;
  }

  // historical-max reference lines (full history window, whatever range is on screen)
  const mx = pct
    ? [['Max net long', m.maxNetLongPct], ['Max gross long', m.maxGrossLongPct], ['Max net short', m.maxNetShortPct], ['Max gross short', m.maxGrossShortPct]]
    : [['Max net long', m.maxNetLong], ['Max gross long', m.maxGrossLong], ['Max net short', m.maxNetShort], ['Max gross short', m.maxGrossShort]];
  const lines = mx.filter(([, o])=>o).map(([name, o])=>({name, v: name === 'Max gross short' ? -o.v : o.v, date:o.date}));

  let lo = 0, hi = 0;
  pts.forEach(p=>{ lo = Math.min(lo, p[kN], -p[kS]); hi = Math.max(hi, p[kN], p[kL]); });
  lines.forEach(l=>{ lo = Math.min(lo, l.v); hi = Math.max(hi, l.v); });
  const pad = (hi - lo) * 0.05 || 1; lo -= pad; hi += pad;

  const W = 1300, H = 430, M = {l:72, r:176, t:14, b:34};
  const plotW = W - M.l - M.r, plotH = H - M.t - M.b, n = pts.length, step = plotW / n;
  const bw = Math.max(1, Math.min(step * 0.72, 14));
  const y = v => M.t + (hi - v) / (hi - lo) * plotH;
  const cx = i => M.l + (i + 0.5) * step;
  const fmtV = v => pct ? cftcPct(v) : cftcFmt(v);

  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;max-width:100%;font-family:inherit" role="img">`;
  cftcNiceTicks(lo, hi, 7).forEach(t=>{
    svg += `<line x1="${M.l}" x2="${M.l + plotW}" y1="${y(t)}" y2="${y(t)}" style="stroke:var(--border);stroke-width:1"/>`;
    svg += `<text x="${M.l - 8}" y="${y(t) + 4}" text-anchor="end" style="fill:var(--text3);font-size:11px">${cftcAxisFmt(t, pct)}</text>`;
  });
  // gross long (up) and gross short (down) histograms
  pts.forEach((p, i)=>{
    const x0 = cx(i) - bw / 2;
    svg += `<rect x="${x0.toFixed(2)}" y="${y(p[kL]).toFixed(2)}" width="${bw.toFixed(2)}" height="${Math.max(0, y(0) - y(p[kL])).toFixed(2)}" fill="#2e8f52" fill-opacity=".28"/>`;
    svg += `<rect x="${x0.toFixed(2)}" y="${y(0).toFixed(2)}" width="${bw.toFixed(2)}" height="${Math.max(0, y(-p[kS]) - y(0)).toFixed(2)}" fill="#c0392b" fill-opacity=".28"/>`;
  });
  svg += `<line x1="${M.l}" x2="${M.l + plotW}" y1="${y(0)}" y2="${y(0)}" style="stroke:var(--text3);stroke-width:1"/>`;
  // historical maxima: faint dashed lines, labelled at the right (labels nudged apart if two sit close together)
  const lab = lines.map(l=>({...l, ly: y(l.v)})).sort((a, b)=>a.ly - b.ly);
  for(let i = 1; i < lab.length; i++){ if(lab[i].ly - lab[i-1].ly < 13) lab[i].ly = lab[i-1].ly + 13; }
  lines.forEach(l=>{
    svg += `<line x1="${M.l}" x2="${M.l + plotW}" y1="${y(l.v)}" y2="${y(l.v)}" style="stroke:var(--ref-color);stroke-opacity:.6;stroke-width:1.2;stroke-dasharray:5 5"/>`;
  });
  lab.forEach(l=>{
    svg += `<text x="${M.l + plotW + 8}" y="${l.ly + 4}" style="fill:var(--ref-color);font-size:10.5px;font-style:italic"><title>${l.name} — set ${l.date}</title>${l.name} ${fmtV(l.v)}</text>`;
  });
  // net position line
  svg += `<polyline fill="none" points="${pts.map((p, i)=>cx(i).toFixed(1) + ',' + y(p[kN]).toFixed(1)).join(' ')}" style="stroke:var(--amber);stroke-width:2;stroke-linejoin:round"/>`;
  // x axis: a label every few months
  const every = cftcChartYears <= 1 ? 1 : cftcChartYears <= 2 ? 3 : cftcChartYears <= 5 ? 6 : 12;
  let lastMi = -1;
  pts.forEach((p, i)=>{
    const d = new Date(p.date + 'T00:00:00Z'), mi = d.getUTCFullYear() * 12 + d.getUTCMonth();
    if(mi % every === 0 && mi !== lastMi){
      lastMi = mi;
      svg += `<line x1="${cx(i)}" x2="${cx(i)}" y1="${M.t + plotH}" y2="${M.t + plotH + 5}" style="stroke:var(--text3)"/>`;
      svg += `<text x="${cx(i)}" y="${H - 12}" text-anchor="middle" style="fill:var(--text3);font-size:11px">${d.toLocaleDateString('en-US', {month:'short', year:'2-digit', timeZone:'UTC'})}</text>`;
    }
  });
  svg += `<g class="cftc-hover" pointer-events="none"></g><rect class="cftc-hit" x="${M.l}" y="${M.t}" width="${plotW}" height="${plotH}" fill="transparent"/></svg>`;

  box.innerHTML = html + svg;
  wireCftcChartControls(box, idx, list);

  // hover read-out: both units for the week under the cursor
  const el = box.querySelector('svg'), hit = el.querySelector('.cftc-hit'), g = el.querySelector('.cftc-hover');
  hit.addEventListener('mousemove', ev=>{
    const r = el.getBoundingClientRect(), x = (ev.clientX - r.left) * (W / r.width);
    const i = Math.max(0, Math.min(n - 1, Math.floor((x - M.l) / step))), p = pts[i], X = cx(i);
    const rows = [
      new Date(p.date + 'T00:00:00Z').toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric', year:'numeric', timeZone:'UTC'}),
      `Net          ${cftcFmt(p.net)}  (${cftcPct(p.netPct)} OI)`,
      `Gross long   ${cftcFmt(p.long)}  (${cftcPct(p.longPct)})`,
      `Gross short  ${cftcFmt(p.short)}  (${cftcPct(p.shortPct)})`,
    ];
    const tw = 268, th = rows.length * 16 + 12, tx = X > M.l + plotW / 2 ? X - tw - 12 : X + 12, ty = M.t + 8;
    g.innerHTML = `<line x1="${X}" x2="${X}" y1="${M.t}" y2="${M.t + plotH}" style="stroke:var(--text3);stroke-width:1;stroke-dasharray:3 3"/>`
      + `<circle cx="${X}" cy="${y(p[kN])}" r="4" style="fill:var(--amber)"/>`
      + `<rect x="${tx}" y="${ty}" width="${tw}" height="${th}" rx="3" style="fill:var(--bg);stroke:var(--border2)"/>`
      + rows.map((t, k)=>`<text x="${tx + 10}" y="${ty + 20 + k * 16}" xml:space="preserve" style="fill:${k === 0 ? 'var(--amber)' : 'var(--text)'};font-size:11.5px;font-weight:${k === 0 ? 800 : 600}">${t.replace(/ /g, '\u00a0')}</text>`).join('');
  });
  hit.addEventListener('mouseleave', ()=>{ g.innerHTML = ''; });
}

// Net-position change: a histogram of the week-over-week change in (gross long - gross short), in contracts.
// Green = net buying (funds adding longs and/or covering shorts), red = net selling.
function renderCftcChangeChart(box, headerHtml, full, cutIso, idx, list){
  const pts = full.filter(p => p.date >= cutIso && p.chg !== null);
  if(pts.length < 2){
    box.innerHTML = headerHtml + `<div style="padding:30px 0;color:var(--text3)">Not enough history to chart.</div>`;
    wireCftcChartControls(box, idx, list);
    return;
  }
  let mx = 0; pts.forEach(p=>{ mx = Math.max(mx, Math.abs(p.chg)); });
  mx = (mx || 1) * 1.1;
  const W = 1300, H = 430, M = {l:72, r:30, t:14, b:34};
  const plotW = W - M.l - M.r, plotH = H - M.t - M.b, n = pts.length, step = plotW / n, bw = Math.max(1, Math.min(step * 0.72, 16));
  const y = v => M.t + (mx - v) / (2 * mx) * plotH, cx = i => M.l + (i + 0.5) * step;
  const signed = v => v === null ? '—' : (v > 0 ? '+' : '') + cftcFmt(v);
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;max-width:100%;font-family:inherit" role="img">`;
  cftcNiceTicks(-mx, mx, 8).forEach(t=>{
    svg += `<line x1="${M.l}" x2="${M.l + plotW}" y1="${y(t)}" y2="${y(t)}" style="stroke:var(--border);stroke-width:1"/>`;
    svg += `<text x="${M.l - 8}" y="${y(t) + 4}" text-anchor="end" style="fill:var(--text3);font-size:11px">${t > 0 ? '+' : ''}${cftcAxisFmt(t, false)}</text>`;
  });
  pts.forEach((p, i)=>{
    const top = Math.min(y(p.chg), y(0)), h = Math.abs(y(p.chg) - y(0));
    svg += `<rect x="${(cx(i) - bw / 2).toFixed(2)}" y="${top.toFixed(2)}" width="${bw.toFixed(2)}" height="${h.toFixed(2)}" fill="${p.chg >= 0 ? '#2e8f52' : '#c0392b'}" fill-opacity=".62"/>`;
  });
  svg += `<line x1="${M.l}" x2="${M.l + plotW}" y1="${y(0)}" y2="${y(0)}" style="stroke:var(--text3);stroke-width:1"/>`;
  const every = cftcChartYears <= 1 ? 1 : cftcChartYears <= 2 ? 3 : cftcChartYears <= 5 ? 6 : 12;
  let lastMi = -1;
  pts.forEach((p, i)=>{
    const d = new Date(p.date + 'T00:00:00Z'), mi = d.getUTCFullYear() * 12 + d.getUTCMonth();
    if(mi % every === 0 && mi !== lastMi){
      lastMi = mi;
      svg += `<line x1="${cx(i)}" x2="${cx(i)}" y1="${M.t + plotH}" y2="${M.t + plotH + 5}" style="stroke:var(--text3)"/>`;
      svg += `<text x="${cx(i)}" y="${H - 12}" text-anchor="middle" style="fill:var(--text3);font-size:11px">${d.toLocaleDateString('en-US', {month:'short', year:'2-digit', timeZone:'UTC'})}</text>`;
    }
  });
  svg += `<g class="cftc-hover" pointer-events="none"></g><rect class="cftc-hit" x="${M.l}" y="${M.t}" width="${plotW}" height="${plotH}" fill="transparent"/></svg>`;
  box.innerHTML = headerHtml + svg;
  wireCftcChartControls(box, idx, list);

  const el = box.querySelector('svg'), hit = el.querySelector('.cftc-hit'), g = el.querySelector('.cftc-hover');
  hit.addEventListener('mousemove', ev=>{
    const r = el.getBoundingClientRect(), x = (ev.clientX - r.left) * (W / r.width);
    const i = Math.max(0, Math.min(n - 1, Math.floor((x - M.l) / step))), p = pts[i], X = cx(i);
    const rows = [
      new Date(p.date + 'T00:00:00Z').toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric', year:'numeric', timeZone:'UTC'}),
      `Net change   ${signed(p.chg)}  (${p.chg > 0 ? 'buying' : p.chg < 0 ? 'selling' : 'flat'})`,
      `Net position ${cftcFmt(p.net)}`,
      `Longs ${signed(p.dLong)}   Shorts ${signed(p.dShort)}`,
    ];
    const tw = 286, th = rows.length * 16 + 12, tx = X > M.l + plotW / 2 ? X - tw - 12 : X + 12, ty = M.t + 8;
    g.innerHTML = `<line x1="${X}" x2="${X}" y1="${M.t}" y2="${M.t + plotH}" style="stroke:var(--text3);stroke-width:1;stroke-dasharray:3 3"/>`
      + `<rect x="${tx}" y="${ty}" width="${tw}" height="${th}" rx="3" style="fill:var(--bg);stroke:var(--border2)"/>`
      + rows.map((t, k)=>`<text x="${tx + 10}" y="${ty + 20 + k * 16}" xml:space="preserve" style="fill:${k === 0 ? 'var(--amber)' : 'var(--text)'};font-size:11.5px;font-weight:${k === 0 ? 800 : 600}">${t.replace(/ /g, '\u00a0')}</text>`).join('');
  });
  hit.addEventListener('mouseleave', ()=>{ g.innerHTML = ''; });
}

function wireCftcChartControls(box, idx, list){
  box.querySelectorAll('.cftc-mode').forEach(b=>b.addEventListener('click', ()=>{ cftcChartMode = b.dataset.v; renderCftcChart(); }));
  box.querySelectorAll('.cftc-years').forEach(b=>b.addEventListener('click', ()=>{ cftcChartYears = +b.dataset.v; renderCftcChart(); }));
  box.querySelectorAll('.cftc-step').forEach(b=>b.addEventListener('click', ()=>{
    if(!list.length) return;
    const next = list[(idx + +b.dataset.d + list.length) % list.length];
    cftcSelect(next.code, false);
  }));
}

// Sizes every CFTC column to the widest thing actually in it, measured in the browser with the real data and font, so
// nothing is ever cut off (fixed guesses kept failing once real numbers - 7-digit Treasury positions, 6-digit OI
// changes - arrived). Spare width is shared out in proportion to CFTC_COL_WIDTHS; if the content needs more room than the
// window offers, the whole table is scaled down to fit - so it never clips and never scrolls sideways.
function fitCftcTable(){
  const table = document.querySelector('#cftc-root table.cftc-table');
  if(!table || !table.offsetParent) return;          // page hidden: it is fitted when the tab is shown
  const box = table.parentElement, wrap = box.parentElement;
  const cols = [...table.querySelectorAll('colgroup col')], n = cols.length;
  // start from a clean, unscaled state so the measurements below are true sizes
  box.style.transform = ''; box.style.width = ''; wrap.style.height = ''; wrap.style.overflowX = '';
  table.style.minWidth = ''; table.style.width = '';
  cols.forEach((c, i)=>{ c.style.width = CFTC_COL_WIDTHS[i] + '%'; });
  const need = new Array(n).fill(0), wide = [];
  const headRows = table.tHead ? [...table.tHead.rows] : [];
  [...table.rows].forEach(tr=>{
    if(tr.classList.contains('cftc-row-section')) return;
    let ci = (headRows.length > 1 && tr === headRows[1]) ? 1 : 0;       // 2nd header row starts after the Product column
    [...tr.cells].forEach(cell=>{
      const span = cell.colSpan || 1, cs = getComputedStyle(cell), rg = document.createRange();
      rg.selectNodeContents(cell);
      const w = Math.ceil(rg.getBoundingClientRect().width + parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight) + parseFloat(cs.borderLeftWidth || 0) + 4);
      if(span === 1) need[ci] = Math.max(need[ci], w); else wide.push({ci, span, w});
      ci += span;
    });
  });
  // a heading that spans several columns (e.g. "Gross Positions") must fit across them
  wide.forEach(({ci, span, w})=>{
    const have = need.slice(ci, ci + span).reduce((a, b)=>a + b, 0);
    if(w > have){ const add = (w - have) / span; for(let k = ci; k < ci + span; k++) need[k] += add; }
  });
  // Leave 3px of slack: the table's collapsed borders and sub-pixel rounding must never push it past its box (a 1px overshoot is
  // enough for a browser to show a horizontal scrollbar), and the box itself is never allowed to scroll sideways at all.
  const sumNeed = need.reduce((a, b)=>a + b, 0), avail = wrap.clientWidth - 3;
  wrap.style.overflowX = 'hidden'; wrap.style.overflowX = 'clip';   // ('clip' is ignored by old browsers, which then keep 'hidden')
  if(sumNeed > avail){
    // lay the table out at the width it needs, then scale that down to the window. The scale comes from the widths
    // actually set (each rounded up), so the scaled table can't overshoot the box by a pixel or two.
    const px = need.map(Math.ceil), sum = px.reduce((a, b)=>a + b, 0);
    cols.forEach((c, i)=>{ c.style.width = px[i] + 'px'; });
    table.style.width = sum + 'px'; box.style.width = sum + 'px';
    const w = Math.max(sum, table.offsetWidth), z = avail / w;      // table.offsetWidth includes the collapsed borders
    box.style.width = w + 'px';
    box.style.transform = `scale(${z})`;
    wrap.style.height = (Math.ceil(box.offsetHeight * z) + 2) + 'px';   // a transform doesn't change layout height, so set it
  } else {
    const extra = avail - sumNeed;                               // plenty of room: share the spare width out
    cols.forEach((c, i)=>{ c.style.width = (Math.floor((need[i] + extra * CFTC_COL_WIDTHS[i] / 100) * 10) / 10) + 'px'; });   // rounded down so the total can't exceed the box
    table.style.width = avail + 'px';
  }
}
let _cftcFitTimer = null;
window.addEventListener('resize', ()=>{ clearTimeout(_cftcFitTimer); _cftcFitTimer = setTimeout(fitCftcTable, 150); });

function renderCftc(){
  const root = document.getElementById('cftc-root');
  root.innerHTML = '';
  const yrs = CFTC_DATA._meta?.years_history;
  { const d = latestCftcDate(); setMetaLines('cftc-meta', CFTC_DATA._meta?.fetched_at, d ? 'Positions as of ' + fmtAsOfDate(d, true) : ''); }
  const list = cftcProductList();
  if(!list.some(e=>e.code === cftcSelected)) cftcSelected = list.length ? list[0].code : null;   // first product with data
  root.insertAdjacentHTML('beforeend', buildCftcMasterTable());
  root.insertAdjacentHTML('beforeend', `<div id="cftc-chart"></div>`);
  root.querySelectorAll('tr.cftc-click').forEach(tr=>tr.addEventListener('click', ()=>cftcSelect(tr.dataset.code, true)));
  fitCftcTable();
  renderCftcChart();
  root.insertAdjacentHTML('beforeend', `<div class="page-footnote">Click any row to chart it below. Managed Money (Fund) category; currencies, equities and Treasuries show Leveraged Funds (the closest equivalent in CFTC's financial-futures report) — ${yrs ? yrs+'yr lookback' : ''} — highlighted cells are top/bottom 10% of that lookback window. Small figure beside Gross Long/Short = change since last week (green = added, red = cut). Historical Max (blue-grey) = largest net long, net short, gross long and gross short over the window, in contracts (net maxes also show the largest % of OI in small type). Hover Gross Positions for % of open interest, and Historical Max for dates.</div>`);
}

function loadCftc(){
  if(cftcLoaded) return;
  cftcLoaded = true;
  fetch('data/cftc_data.json?_=' + Date.now())
    .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(data=>{
      CFTC_DATA = data;
      renderCftc();
      cftcReady = true;
      checkSummaryReady();
    })
    .catch(e=>{
      document.getElementById('cftc-root').innerHTML = `<div id="cftc-err">Error loading CFTC data: ${e.message}</div>`;
      cftcLoaded = false;
    });
}

function summaryYearsSorted(usdaComm){
  const countries = DATA[usdaComm];
  if(!countries) return [];
  const allYears = new Set();
  Object.values(countries).forEach(yrs=>Object.keys(yrs).forEach(y=>allYears.add(y)));
  return [...allYears].sort();
}

function summaryProdYoY(usdaComm, country){
  const countries = DATA[usdaComm];
  if(!countries || !countries[country]) return null;
  const years = summaryYearsSorted(usdaComm);
  if(years.length<2) return null;
  const latest = years[years.length-1], prev = years[years.length-2];
  const curRaw = countries[country][latest], prevRaw = countries[country][prev];
  const cur = (curRaw && curRaw.pr!==undefined) ? curRaw.pr : null;
  const pr0 = (prevRaw && prevRaw.pr!==undefined) ? prevRaw.pr : null;
  return yoyPct(cur, pr0);
}

function summaryProdYoYAgg(usdaComm, countryList){
  const countries = DATA[usdaComm];
  if(!countries || !countryList || !countryList.length) return null;
  const years = summaryYearsSorted(usdaComm);
  if(years.length<2) return null;
  const latest = years[years.length-1], prev = years[years.length-2];
  const curAgg = sumCountries(countries, countryList, latest);
  const prevAgg = sumCountries(countries, countryList, prev);
  const cur = (curAgg && curAgg.pr!==undefined) ? curAgg.pr : null;
  const pr0 = (prevAgg && prevAgg.pr!==undefined) ? prevAgg.pr : null;
  return yoyPct(cur, pr0);
}

function summaryStuPctile(usdaComm, yearDataFn){
  const years = summaryYearsSorted(usdaComm);
  if(!years.length) return null;
  const hist = years.map(y=>getStu(yearDataFn(y))).filter(v=>v!==null);
  const latestYear = years[years.length-1];
  const v = getStu(yearDataFn(latestYear));
  if(v===null || !hist.length) return null;
  return {p: hist.filter(x=>x<=v).length/hist.length*100, v};   // rank vs history, and the actual stocks/use %
}

// Vegoils-combined equivalents of the above — sum across all 4 tracked oils instead of one commodity.
function summaryProdYoYCombined(commList, country){
  const years = commodityGroupAllYears(commList);
  if(years.length<2) return null;
  const latest = years[years.length-1], prev = years[years.length-2];
  const curAgg = sumAcrossOils((m,yr)=>(DATA[m]&&DATA[m][country])?DATA[m][country][yr]:undefined, latest, commList);
  const prevAgg = sumAcrossOils((m,yr)=>(DATA[m]&&DATA[m][country])?DATA[m][country][yr]:undefined, prev, commList);
  const cur = (curAgg && curAgg.pr!==undefined) ? curAgg.pr : null;
  const pr0 = (prevAgg && prevAgg.pr!==undefined) ? prevAgg.pr : null;
  return yoyPct(cur, pr0);
}
function summaryProdYoYAggCombined(commList, countryList){
  const years = commodityGroupAllYears(commList);
  if(years.length<2 || !countryList || !countryList.length) return null;
  const latest = years[years.length-1], prev = years[years.length-2];
  const curAgg = sumAcrossOils((m,yr)=>sumCountries(DATA[m]||{}, countryList, yr), latest, commList);
  const prevAgg = sumAcrossOils((m,yr)=>sumCountries(DATA[m]||{}, countryList, yr), prev, commList);
  const cur = (curAgg && curAgg.pr!==undefined) ? curAgg.pr : null;
  const pr0 = (prevAgg && prevAgg.pr!==undefined) ? prevAgg.pr : null;
  return yoyPct(cur, pr0);
}
function summaryStuPctileCombined(commList, entityFn){
  const years = commodityGroupAllYears(commList);
  if(!years.length) return null;
  const hist = years.map(y=>getStu(sumAcrossOils(entityFn, y, commList))).filter(v=>v!==null);
  const latestYear = years[years.length-1];
  const v = getStu(sumAcrossOils(entityFn, latestYear, commList));
  if(v===null || !hist.length) return null;
  return {p: hist.filter(x=>x<=v).length/hist.length*100, v};
}

function summaryPctileClass(p){
  if(p===null || p===undefined) return '';
  if(p<=25) return 'pctile-tight';
  if(p>=75) return 'pctile-loose';
  return 'pctile-mid';
}

function summaryPctileText(p){ return p===null||p===undefined ? '—' : cftcOrdinal(p); }
// Stocks-to-use cell: just the rank vs history (the actual stocks/use % is in the hover text)
function summaryStuCell(o, first){
  const cls = (first ? 'grp-l ' : '') + summaryPctileClass(o ? o.p : null);
  if(!o) return `<td class="${cls}">—</td>`;
  return `<td class="${cls}" title="Rank vs history (higher = looser) · stocks/use ${fmtStu(o.v)}">${summaryPctileText(o.p)}</td>`;
}

// This week and the week after it. After the last slot ("Dec 28") the next week is early January; slot 0 ("Dec 29") is
// that same New Year week, so it is skipped.
function getSeasonalPair(productName){
  const cur = getNextSeasonalEntry(productName);
  if(!cur) return [null, null];
  const vals = SEASONALS_DATA[productName];
  const i = SEASONALS_WEEKS.indexOf(cur.label);
  const j = (i >= SEASONALS_WEEKS.length - 1) ? 1 : i + 1;
  return [cur, {label: SEASONALS_WEEKS[j], value: vals[j]}];
}
function seasonalHeaderLabels(){
  const first = (typeof SEASONALS_DATA !== 'undefined') ? Object.keys(SEASONALS_DATA)[0] : null;
  const pair = first ? getSeasonalPair(first) : [null, null];
  return [pair[0] ? pair[0].label : 'This Wk', pair[1] ? pair[1].label : 'Next Wk'];
}

function getNextSeasonalEntry(productName){
  if(typeof SEASONALS_WEEKS === 'undefined' || typeof SEASONALS_DATA === 'undefined') return null;
  const vals = SEASONALS_DATA[productName];
  if(!vals) return null;
  const monthMap = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
  const today = new Date(); today.setHours(0,0,0,0);
  const year = today.getFullYear();
  // Picks the most recent week whose start date is on or before today — i.e. the
  // currently-active weekly period, not the upcoming one. E.g. if today is Sep 15
  // and the labeled weeks are "Sep 14" / "Sep 21", this returns "Sep 14" since
  // today falls inside that week's Sep 14–20 span.
  let best = null;
  // also try last year's dates: in early January the newest week started the previous December (Dec 28/29)
  [year-1, year].forEach(yr=>{
    SEASONALS_WEEKS.forEach((w,i)=>{
      const parts = w.split(' ');
      const d = new Date(yr, monthMap[parts[0]], parseInt(parts[1],10));
      if(d<=today && (best===null || d>best.date)){
        best = {date:d, label:w, value:vals[i]};
      }
    });
  });
  return best;
}

// Relative column weights -> percentages summing to 100, so a table can fill its container at any width.
function colPercents(weights){ const t = weights.reduce((a,b)=>a+b,0); return weights.map(w=>(w/t*100).toFixed(3)+'%'); }

function buildSummaryTable(){
  const wk = seasonalHeaderLabels();   // the two week-start dates, e.g. "Oct 19" and "Oct 26"
  // Seasonality keeps the width it had as one column (5.5 + 5.5 = 11 of 100); the YoY wording moves into the sub-headers.
  const groups = [
    {label:'Seasonality', cols:[{l:wk[0], w:5.5}, {l:wk[1], w:5.5}]},
    {label:'Positioning', cols:[{l:'Net % OI', w:7}, {l:'Pctile', w:6.5}, {l:'Change', w:7}]},
    {label:'Production', cols:[{l:'Domestic YoY', w:10}, {l:'Exporters YoY', w:10}]},
    {label:'Export Sales', cols:[{l:'Total Commit. YoY', w:13}]},
    {label:'Stocks to Use', cols:[{l:'Domestic', w:9.25}, {l:'World', w:9.25}]},
  ];
  const totalCols = 1 + groups.reduce((sum,g)=>sum+g.cols.length,0);
  const productWidth = 17;

  const pcts = colPercents([productWidth, ...groups.flatMap(g=>g.cols.map(c=>c.w))]);
  let html = `<div class="tbl-wrap"><table class="summary-table"><colgroup>${pcts.map(pc=>`<col style="width:${pc}">`).join('')}`;
  html += `</colgroup><thead><tr><th rowspan="2">Product</th>`;
  groups.forEach(g=>{ html += `<th colspan="${g.cols.length}" class="grp-l" style="text-align:center;color:var(--amber);font-size:13px;letter-spacing:.08em">${g.label}</th>`; });
  html += `</tr><tr>`;
  groups.forEach(g=>{
    g.cols.forEach((c,i)=>{ html += `<th${i===0?' class="grp-l"':''}>${c.l}</th>`; });
  });
  html += `</tr></thead><tbody>`;

  let curSection = null;
  SUMMARY_ROWS.forEach(row=>{
    if(row.section !== curSection){
      curSection = row.section;
      html += `<tr class="cftc-row-section"><td colspan="${totalCols}">${curSection}</td></tr>`;
    }

    const countries = DATA[row.usdaComm] || {};
    const expList = row.combinedList ? row.combinedExporters : (EXPORTERS[row.usdaComm]||[]).filter(c=>countries[c]);

    // Seasonality: this week and next
    const seasPair = getSeasonalPair(row.seasonalName);

    // Positioning (CFTC)
    const hist = (CFTC_DATA.codes && CFTC_DATA.codes[row.cftcCode]) ? CFTC_DATA.codes[row.cftcCode].history : null;
    const m = computeLatestMetrics({code:row.cftcCode, label:row.label}, hist);

    // Fundamentals
    let domesticYoY, exportersYoY, domesticStu, worldStu;
    if(row.combinedList){
      domesticYoY = summaryProdYoYCombined(row.combinedList, row.domestic);
      exportersYoY = summaryProdYoYAggCombined(row.combinedList, expList);
      domesticStu = summaryStuPctileCombined(row.combinedList, (cm,yr)=>(DATA[cm]&&DATA[cm][row.domestic])?DATA[cm][row.domestic][yr]:undefined);
      worldStu = summaryStuPctileCombined(row.combinedList, (cm,yr)=>(DATA[cm]&&DATA[cm]['World'])?DATA[cm]['World'][yr]:undefined);
    } else {
      domesticYoY = summaryProdYoY(row.usdaComm, row.domestic);
      exportersYoY = summaryProdYoYAgg(row.usdaComm, expList);
      domesticStu = summaryStuPctile(row.usdaComm, y=>(countries[row.domestic]||{})[y]);
      worldStu = summaryStuPctile(row.usdaComm, y=>(countries['World']||{})[y]);
    }

    // Export Sales — Total Commitment YoY
    let totalCommitYoY = null;
    if(row.exportName && EXPORTS_DATA && EXPORTS_DATA.commodities && EXPORTS_DATA.commodities[row.exportName]){
      const t = EXPORTS_DATA.commodities[row.exportName].total;
      if(t) totalCommitYoY = t.yoy_total_commitment_pct;
    }

    html += `<tr><td>${row.label}</td>`;
    seasPair.forEach((seas, k)=>{
      const first = k===0 ? 'grp-l' : '';
      if(!seas){
        html += `<td class="${first}" style="color:var(--text3)">—</td>`;
      } else {
        const text = (seas.value>0?'+':'')+seas.value;
        html += `<td class="${first}" style="background:${seasonalColor(seas.value)};color:#111;font-weight:800" title="Week of ${seas.label}">${text}</td>`;
      }
    });
    if(!m){
      html += `<td class="grp-l" colspan="3" style="text-align:left;color:var(--text3)">No CFTC data</td>`;
    } else {
      html += `<td class="grp-l ${m.netPctOi>=0?'cftc-up':'cftc-dn'}">${cftcPct(m.netPctOi)}</td>`;
      html += `<td class="${netExtremeClass(m.netPctile)}">${m.netPctile===null?'—':cftcOrdinal(m.netPctile)}</td>`;
      const chgCls = (m.weeklyChange===null || m.weeklyChange===0) ? '' : (m.weeklyChange>0 ? 'cftc-up' : 'cftc-dn');
      html += `<td class="${chgCls}" title="${posActionText(m.net, m.weeklyChange)} (net position vs last week, contracts)">${cftcSignedNum(m.weeklyChange)}</td>`;
    }
    html += `<td class="grp-l ${domesticYoY>=0?'cftc-up':'cftc-dn'}">${cftcSignedPct(domesticYoY,1)}</td>`;
    html += `<td class="${exportersYoY>=0?'cftc-up':'cftc-dn'}">${cftcSignedPct(exportersYoY,1)}</td>`;
    html += `<td class="grp-l ${totalCommitYoY>=0?'cftc-up':'cftc-dn'}">${totalCommitYoY===null?'—':cftcSignedPct(totalCommitYoY,1)}</td>`;
    html += summaryStuCell(domesticStu, true);
    html += summaryStuCell(worldStu, false);
    html += `</tr>`;
  });

  html += `</tbody></table></div>`;
  return html;
}
